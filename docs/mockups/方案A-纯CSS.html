<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>方案 A · 纯 CSS 像素风</title>
<!--
  方案 A：纯 CSS
  房间里的每一样东西（窗、门、桌）都是手写的 div，用 left/top/width/height 摆位置。
  成绩单那张像素小图是用 box-shadow「一个像素一条阴影」堆出来的。
  请你重点体会：改一个像素要动多少东西。
-->
<style>
  :root{ --ink:#e8e6e3; --muted:#9a9a9a; --line:#2a2f3a; --gold:#c9a227; }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; background:#0b0d12; color:var(--ink);
    font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px;
  }
  .caption{ font-size:14px; color:var(--muted); letter-spacing:.5px; }
  .caption b{ color:var(--gold); font-weight:400; }

  #app{ width:640px; }

  /* ===== 房间：全部手写定位 ===== */
  #room{
    position:relative; width:640px; height:368px; background:#1b1e26; overflow:hidden;
    box-shadow:0 0 0 2px var(--line);
  }
  .floor{ position:absolute; left:0; right:0; bottom:0; height:80px; background:#242832; }
  .floor::after{
    content:""; position:absolute; inset:0;
    background-image:linear-gradient(90deg,#1e222b 2px,transparent 2px);
    background-size:32px 100%;
  }
  .win{ position:absolute; left:64px; top:32px; width:128px; height:80px; background:#3a4356; }
  .win i{ position:absolute; inset:6px; display:block; background:#2b3444; }
  .win::before,.win::after{ content:""; position:absolute; background:#3a4356; z-index:2; }
  .win::before{ left:50%; top:0; bottom:0; width:6px; margin-left:-3px; }
  .win::after{ top:50%; left:0; right:0; height:6px; margin-top:-3px; }
  .dust{ position:absolute; left:70px; top:38px; width:116px; height:68px; background:#8a8f7a; opacity:.5; z-index:3; }

  .door{ position:absolute; left:336px; top:144px; width:96px; height:112px; background:#3a2f22; }
  .door i{ position:absolute; inset:8px; display:block; background:#2a2118; }
  .lock{ position:absolute; left:372px; top:200px; width:16px; height:16px; background:var(--gold); z-index:4; }

  .desk{ position:absolute; left:448px; top:288px; width:176px; height:16px; background:#4a3728; }
  .desk i{ position:absolute; top:16px; width:16px; height:56px; display:block; background:#3a2b1f; }
  .desk i.a{ left:8px; }
  .desk i.b{ right:8px; }

  /* 成绩单：5×4 像素，一个像素一条 box-shadow —— 这就是「痛」的地方 */
  .card{
    position:absolute; left:496px; top:248px; width:8px; height:8px; background:#f2e9d8;
    cursor:pointer; animation:breathe 1.6s ease-in-out infinite;
    box-shadow:
      8px 0 #f2e9d8, 16px 0 #f2e9d8, 24px 0 #f2e9d8, 32px 0 #f2e9d8,
      0 8px #f2e9d8, 8px 8px #f2e9d8, 16px 8px #6b7280, 24px 8px #f2e9d8, 32px 8px #f2e9d8,
      0 16px #f2e9d8, 8px 16px #f2e9d8, 16px 16px #d94a4a, 24px 16px #f2e9d8, 32px 16px #f2e9d8,
      0 24px #f2e9d8, 8px 24px #f2e9d8, 16px 24px #f2e9d8, 24px 24px #f2e9d8, 32px 24px #f2e9d8;
  }
  @keyframes breathe{
    0%,100%{ filter:brightness(1) }
    50%{ filter:brightness(1.7) drop-shadow(0 0 6px var(--gold)) }
  }

  /* ===== 回忆弹层 ===== */
  #overlay{
    position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    background:#06070ae6; z-index:20; padding:32px;
  }
  #overlay.on{ display:flex; }
  .box{ background:#14161c; border:2px solid var(--line); padding:24px 28px; max-width:440px; }
  .box h2{ font-size:15px; color:var(--gold); margin:0 0 12px; font-weight:400; }
  .box p{ font-size:17px; line-height:1.9; margin:0 0 20px; }
  button{
    font-family:inherit; font-size:15px; color:var(--ink); background:#1d2230;
    border:2px solid var(--line); padding:8px 18px; cursor:pointer;
  }
  button:hover{ background:#26304a; border-color:#4a5a80; }

  /* ===== 对话区 ===== */
  #dlg{
    margin-top:10px; background:#14161c; border:2px solid var(--line); padding:14px 18px;
  }
  #who{ font-size:13px; color:#7fb3d5; margin-bottom:6px; }
  #txt{ font-size:16px; line-height:1.7; }
  #choices{ display:flex; flex-direction:column; gap:6px; margin-top:10px; }
  #choices span{ font-size:15px; color:var(--muted); }
</style>
</head>
<body>
  <div class="caption">方案 A · <b>纯 CSS</b>：每个方块都是手写定位的 div</div>

  <div id="app">
    <div id="room">
      <div class="floor"></div>
      <div class="win"><i></i></div>
      <div class="dust"></div>
      <div class="door"><i></i></div>
      <div class="lock"></div>
      <div class="desk"><i class="a"></i><i class="b"></i></div>
      <div class="card" id="card" title="一张成绩单"></div>

      <div id="overlay">
        <div class="box">
          <h2>一段记忆 · 成绩单</h2>
          <p>你记得这张成绩单。九十二分。<br>你把它拿回家的时候，心里其实是高兴的。<br>「怎么不是满分？」</p>
          <button id="close">放回抽屉</button>
        </div>
      </div>
    </div>

    <div id="dlg">
      <div id="who">咨询师</div>
      <div id="txt">你比预约时间早到了二十分钟。走廊尽头的门牌上写着「心理咨询室」。</div>
      <div id="choices">
        <span>· 我想先说说最近的状态</span>
        <span>· 我不太确定该从哪里开始</span>
      </div>
    </div>
  </div>

<script>
  const overlay = document.getElementById('overlay');
  document.getElementById('card').addEventListener('click', () => overlay.classList.add('on'));
  document.getElementById('close').addEventListener('click', () => overlay.classList.remove('on'));
</script>
</body>
</html>

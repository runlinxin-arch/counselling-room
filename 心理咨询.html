<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>心理咨询 · 康复心理学课程作业</title>
<meta name="description" content="一个叙事驱动的康复心理学科普游戏。你扮演康复医院心理门诊的咨询师。">
<meta name="color-scheme" content="dark">
<style>
/* ==========================================================================
   《心理咨询》· 样式
   设计令牌在最上面，下面的规则全部从这里取值。改颜色只改这一段。
   ========================================================================== */

:root {
  /* ---- 色板（全部取自方案 B 已冻结的 39 色，界面和房间是同一个下午）---- */
  --wall:      #241b14;  /* 墙灰 · 页面底 */
  --wall-dark: #1b140f;  /* 深缝 · 更深一层 */
  --base:      #3a2b1f;  /* 踢脚线 · 所有分隔线 */
  --floor:     #2e2115;  /* 地板棕 · 侧栏 */
  --blue:      #5b8199;  /* 沙发蓝 · 品牌色 */
  --blue-dim:  #3f5f75;  /* 沙发暗蓝 */
  --lamp:      #ffe0a8;  /* 暖灯黄 · 唯一的高饱和暖色 */
  --paper:     #efe3c8;  /* 纸黄 · 督导笔记 */
  --paper-ink: #3a3227;  /* 纸上的字 */
  --ink:       #f4efe6;  /* 钟面米 · 正文 */
  --ink-dim:   #b6ab9c;  /* 次要文字 */
  --ink-faint: #8a7f72;  /* 最弱的一层 */

  /* 说话人 */
  --who-narrator:   #8b8880;
  --who-counselor:  #8fbcd6;
  --who-client:     #d8c39a;
  --who-doctor:     #c0a0a0;

  /* ---- 字体 ---- */
  --sans: "Noto Sans SC", "Source Han Sans SC", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "SimSun", serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
  /* 电话号码用它：等宽是为了"数字对齐"，但电话号码是给人拨的，不是给人比的。
     等宽字体一排版，号码就变成了数据；这里要的是能一眼读出来。 */
  --num: "Noto Sans SC", system-ui, "Segoe UI", sans-serif;

  /* ---- 尺度 ---- */
  --room-w: 636px;
  --room-h: 360px;
  --pad: 22px;
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: #0b0d12;
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* 整个页面就是这间房：底上一层极淡的暖光，四角再压暗 */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(120% 90% at 50% 62%, rgba(255, 217, 160, .045) 0%, rgba(255, 217, 160, 0) 55%),
    radial-gradient(140% 120% at 50% 50%, rgba(0, 0, 0, 0) 45%, rgba(0, 0, 0, .55) 100%);
  z-index: 0;
}

#screen {
  position: relative;
  z-index: 1;
  height: 100%;
  max-width: 880px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
}

/* ==========================================================================
   页头
   ========================================================================== */

/* 页头浮在像素区上方（不占独立一行）：否则它会挤掉文字区的高度，
   7:3 就变成 7:2.3。压在舞台顶端，配一层渐变底，别让文字和房间撞色。 */
#top {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  z-index: 3;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 10px var(--pad) 8px;
  border-bottom: 1px solid var(--wall-dark);
  background: linear-gradient(to bottom, rgba(27,20,15,.92), rgba(27,20,15,.72) 70%, rgba(27,20,15,0));
}

#brand {
  display: flex;
  align-items: baseline;
  gap: 10px;
  min-width: 0;
}

#brand .zh {
  font-size: 15px;
  letter-spacing: .16em;
  color: var(--ink);
}

#brand .en {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .22em;
  color: var(--ink-faint);
  text-transform: uppercase;
}

#brand .chapter {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--blue);
  letter-spacing: .1em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#top .spacer { flex: 1 1 auto; }

/* 常驻的危机入口。这是"热线出现在 3 处"里的第 2 处——
   玩家在任何一屏、任何一步都能点到。 */
#crisisBtn {
  flex: 0 0 auto;
  font-family: inherit;
  font-size: 13px;
  color: #e8b4b4;
  background: transparent;
  border: 1px solid #6b4040;
  border-radius: 2px;
  padding: 5px 12px;
  cursor: pointer;
  letter-spacing: .06em;
  transition: background .15s, border-color .15s, color .15s;
}
#crisisBtn:hover { background: #2a1c1c; border-color: #9b5a5a; color: #ffd6d6; }

/* ==========================================================================
   场景（咨询室）
   ========================================================================== */

/* 布局比例：像素动画区（#stage）: 文字选项区（#panel）= 7 : 3。
   flex 比例是"内容盒"的占比；padding 属于各自那一份里，所以两块的
   实际高度（含 padding）保持 7:3。 */
/* 像素动画区：拿"文字区之外"的全部空间。
   文字区按内容定高（有下限），房间则按剩余空间缩放——这样短窗口下
   房间会缩一缩，而不是把文字/选项/提示裁掉。长窗口下自然接近 7:3。 */
#stage {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 52px var(--pad) 0;
  overflow: hidden;
}

#roomWrap { width: var(--room-w); max-width: 100%; }

#room {
  position: relative;
  width: 100%;
  aspect-ratio: 106 / 60;
  background: var(--wall);
  transform-origin: top center;
  /* 细边框 + 一道内阴影，像墙上开的一扇窗 */
  box-shadow:
    0 0 0 1px var(--base),
    0 0 0 6px rgba(0, 0, 0, .22),
    0 18px 40px -18px rgba(0, 0, 0, .9);
  overflow: hidden;
  transform-origin: top center;
}

#scene { display: block; width: 100%; height: 100%; shape-rendering: crispEdges; }

/* ==========================================================================
   对话区
   ========================================================================== */

#panel {
  /* 文字选项区按内容定高，但给一个下限：太低的话房间会占到 8 成以上，
     文字反而显得孤零零。台词/选项/提示永远完整可见（绝不裁掉）。 */
  flex: 0 0 auto;
  min-height: 30vh;
  display: flex;
  flex-direction: column;
  padding: 18px var(--pad) 16px;
}

#who {
  flex: 0 0 auto;
  font-size: 13px;
  letter-spacing: .1em;
  color: var(--who-narrator);
  min-height: 1.4em;
  margin-bottom: 6px;
}
#who[data-role="咨询师"]      { color: var(--who-counselor); }
#who[data-role="林越"]        { color: var(--who-client); }
#who[data-role="王医生"]      { color: var(--who-doctor); }
#who[data-role="旁白"]        { color: var(--who-narrator); }

#text {
  /* 保持自然高度，不参与伸缩压缩：被压到 0 会整段台词消失。
     空间不够时由 #panel 整体滚动，而不是把正文挤没。 */
  flex: 0 0 auto;
  font-size: 19px;
  line-height: 1.85;
  letter-spacing: .01em;
  color: var(--ink);
}
/* 旁白和内心独白：斜一点、灰一点，和说出来的话分开 */
#text[data-role="旁白"],
#text[data-role="咨询师（内心）"] { color: #b9b5ac; font-style: italic; }

/* ---------------------------------------------------------------------------
   咨询师的聊天气泡
   ---------------------------------------------------------------------------
   有些节点整句就是"咨询师对玩家说的话"（第二人称，"你一上来就复述它，
   他就把你归到「他们」那边去了"）。这类话不是剧情台词，摆在台词区会读成
   游戏在后台点评。放进一个带说话人的气泡里，就变成"咨询师在跟你说话"——
   玩家本来就是扮演这位咨询师的人。

   排版：名字在气泡上方（和台词区的 #who 一致），气泡本身靠左、带小尾巴。
   气泡只长到需要的宽度，不铺满整行——"一句话"和"一段旁白"要能一眼分开。
--------------------------------------------------------------------------- */
/* 气泡节点会把 #text 藏起来，正文区就空出一块。
   #panel 是纵向 flex：让气泡从顶部开始排，它就落在
   "台词本来该出现的位置"，不需要任何负 margin 去凑。 */
#panel.bubble-mode { justify-content: flex-start; }

#chat {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  max-height: 40vh;
  overflow: auto;
}

#chat .bubble {
  position: relative;
  max-width: min(86%, 46em);
  background: rgba(91, 129, 153, .16);
  border: 1px solid rgba(143, 188, 214, .34);
  border-radius: 12px;
  padding: 9px 13px 10px;
}

/* 左上角的小尾巴，指向"咨询师"这个名字 */
#chat .bubble::before {
  content: "";
  position: absolute;
  left: 14px;
  top: -6px;
  width: 10px;
  height: 10px;
  background: rgba(91, 129, 153, .16);
  border-left: 1px solid rgba(143, 188, 214, .34);
  border-top: 1px solid rgba(143, 188, 214, .34);
  transform: rotate(45deg);
}

#chat .who {
  font-size: 11.5px;
  letter-spacing: .12em;
  color: var(--who-counselor);
  margin-bottom: 3px;
}

#chat .say {
  font-size: 15px;
  line-height: 1.7;
  color: var(--ink);
}

/* 气泡里提到来访者原话的那部分：和台词区一样用暖色挑出来 */
#chat .say .q { color: var(--who-client); }

/* 光标：对话推进的提示，也是一个明确的"可点"信号 */
.caret {
  display: inline-block;
  width: .5em;
  color: var(--blue);
  animation: blink 1.1s steps(1, end) infinite;
}
@keyframes blink { 0%, 50% { opacity: 1 } 50.01%, 100% { opacity: 0 } }
.caret.off { visibility: hidden; }

/* ---- 选项 ---- */
#choices {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  gap: 7px;
  margin-top: 14px;
}

.choice {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  width: 100%;
  text-align: left;
  font-family: inherit;
  font-size: 16px;
  line-height: 1.55;
  color: var(--ink);
  background: #191b23;
  border: 1px solid var(--base);
  border-left: 2px solid var(--blue-dim);
  border-radius: 2px;
  padding: 11px 14px;
  cursor: pointer;
  transition: background .14s, border-color .14s, transform .1s;
}
.choice:hover:not(:disabled) {
  background: #20242f;
  border-left-color: var(--blue);
  transform: translateX(2px);
}
.choice:active:not(:disabled) { transform: translateX(2px) scale(.995); }
.choice:disabled { cursor: default; opacity: .5; }

.choice .key {
  flex: 0 0 auto;
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.9;
  color: var(--blue);
  min-width: 1em;
}
.choice .label { flex: 1 1 auto; }

/* ---- 底部提示 ---- */
#hint {
  flex: 0 0 auto;
  position: sticky;
  bottom: 0;
  min-height: 1.5em;
  margin-top: 12px;
  padding-top: 4px;
  font-size: 12.5px;
  color: var(--ink-faint);
  letter-spacing: .04em;
  display: flex;
  align-items: center;
  gap: 8px;
  /* 垫一块和面板一致的底色，滚动时别让文字透过来叠在一起 */
  background: linear-gradient(to bottom, rgba(27,20,15,0), #241b14 40%);
}
#hint .dot {
  width: 6px; height: 6px;
  background: var(--lamp);
  border-radius: 50%;
  box-shadow: 0 0 7px var(--lamp);
  animation: breathe 1.9s ease-in-out infinite;
}
#hint .right { margin-left: auto; font-family: var(--mono); font-size: 11px; }

/* ==========================================================================
   纸（督导笔记 / 科普卡 / 转介单 / 资源卡 / 成绩单）
   这是整个界面唯一的高亮物 —— 别的都得安静。
   ========================================================================== */

#overlay {
  position: fixed;
  inset: 0;
  z-index: 40;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 28px 20px;
  background: rgba(6, 7, 10, .84);
  backdrop-filter: blur(2px);
}
#overlay.on { display: flex; }

.paper {
  position: relative;
  width: min(560px, 100%);
  max-height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--paper);
  color: var(--paper-ink);
  font-family: var(--serif);
  border-radius: 1px;
  box-shadow: 0 24px 60px -20px rgba(0, 0, 0, .95), 0 0 0 1px rgba(0, 0, 0, .4);
  /* 纸角一点点不齐，像真的被裁过 */
  clip-path: polygon(0 .6%, 99.4% 0, 100% 99.2%, .7% 100%);
  animation: paperIn .34s cubic-bezier(.16, .84, .3, 1);
}
@keyframes paperIn {
  from { opacity: 0; transform: translateY(10px) rotate(-.5deg) scale(.985); }
  to   { opacity: 1; transform: none; }
}
#overlay.slide .paper { animation: noteIn .4s cubic-bezier(.16, .84, .3, 1); }
@keyframes noteIn {
  from { opacity: 0; transform: translateX(34px) rotate(1.1deg); }
  to   { opacity: 1; transform: none; }
}

.paper .head {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 16px 24px 10px;
}
.paper .head .label {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .24em;
  text-transform: uppercase;
  color: #8a7c62;
}
.paper[data-kind="referral"]  .head .label { color: #8a5a5a; }
.paper[data-kind="resource"]  .head .label { color: #7a6a3a; }
.paper[data-kind="science"]   .head .label { color: #4f6b7a; }
.paper .head .rule { flex: 1 1 auto; height: 1px; background: rgba(58, 50, 39, .22); }

.paper h2 {
  flex: 0 0 auto;
  margin: 0;
  padding: 0 24px;
  font-size: 20px;
  font-weight: 600;
  line-height: 1.5;
  letter-spacing: .02em;
  color: #2e281f;
}

.paper .body {
  flex: 1 1 auto;
  overflow-y: auto;
  padding: 12px 24px 6px;
  font-size: 16.5px;
  line-height: 1.95;
}
.paper .body p { margin: 0 0 12px; }
.paper .body p:last-child { margin-bottom: 0; }

.paper .foot {
  flex: 0 0 auto;
  padding: 6px 24px 0;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .04em;
  color: #8a7c62;
}
.paper .foot:empty { display: none; }

.paper .actions {
  flex: 0 0 auto;
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  padding: 16px 24px 20px;
}

/* 纸上的按钮：不是界面按钮，是"在纸上盖个章"的感觉 */
.btn {
  font-family: var(--sans);
  font-size: 14px;
  letter-spacing: .08em;
  color: var(--paper-ink);
  background: transparent;
  border: 1px solid rgba(58, 50, 39, .45);
  border-radius: 1px;
  padding: 8px 20px;
  cursor: pointer;
  transition: background .14s, color .14s;
}
.btn:hover { background: rgba(58, 50, 39, .1); }
.btn.primary { background: var(--paper-ink); color: var(--paper); border-color: var(--paper-ink); }
.btn.primary:hover { background: #241f18; }

/* 转介单：右上角一个回形针的暗示，不用图，用一道斜杠 */
.paper[data-kind="referral"]::after {
  content: "";
  position: absolute;
  top: 0; right: 34px;
  width: 12px; height: 46px;
  border: 2px solid rgba(58, 50, 39, .3);
  border-bottom: none;
  border-radius: 6px 6px 0 0;
}

/* 资源卡：加一条红色标记条，和科普卡区分开 */
.paper[data-kind="resource"] { border-top: 3px solid #a4463f; }
.paper[data-kind="resource"] .body { font-size: 17px; }

/* 成绩单 */
.paper[data-kind="result"] .body { font-family: var(--sans); font-size: 15px; line-height: 1.75; }
/* lead 是"结论"，用衬线；下面的清单是"账目"，用无衬线 */
.paper .result-lead {
  margin: 0;
  padding: 10px 24px 0;
  font-family: var(--serif);
  font-size: 16px;
  line-height: 1.95;
  color: #3a3227;
}
.tally { list-style: none; margin: 0 0 16px; padding: 0; }
.tally li {
  display: flex;
  gap: 10px;
  padding: 7px 0;
  border-bottom: 1px dashed rgba(58, 50, 39, .22);
}
.tally li:last-child { border-bottom: none; }
.tally .k { flex: 0 0 7.8em; color: #6d6250; }
.tally .v { flex: 1 1 auto; color: #2e281f; }
.tally .v.miss { color: #8a5a20; }

/* ---- 逐字写出 ---- */
.writing { white-space: pre-wrap; }
.writing .w { opacity: 0; }
.writing .w.on { opacity: 1; }

/* ==========================================================================
   情绪日记（手机备忘录 —— 和"纸"刻意不是一套材质）
   ========================================================================== */

.diary {
  width: min(430px, 100%);
  max-height: 100%;
  display: flex;
  flex-direction: column;
  background: #16181f;
  border: 1px solid var(--base);
  border-radius: 10px;
  box-shadow: 0 24px 60px -20px rgba(0, 0, 0, .95);
  overflow: hidden;
  animation: paperIn .3s cubic-bezier(.16, .84, .3, 1);
}
.diary .bar {
  flex: 0 0 auto;
  padding: 12px 18px 10px;
  border-bottom: 1px solid #23252e;
  font-size: 13px;
  color: var(--ink-dim);
  letter-spacing: .04em;
}
.diary .bar b { color: var(--ink); font-weight: 400; }
.diary .list { flex: 1 1 auto; overflow-y: auto; padding: 8px 10px 12px; }

.entry {
  width: 100%;
  text-align: left;
  font-family: inherit;
  background: transparent;
  border: none;
  border-radius: 6px;
  padding: 11px 12px;
  cursor: pointer;
  display: flex;
  gap: 12px;
  align-items: baseline;
  transition: background .14s;
}
.entry:hover { background: #1e212b; }
.entry.open { background: #1e212b; }
.entry .day {
  flex: 0 0 3.2em;
  font-size: 13px;
  color: var(--blue);
  letter-spacing: .06em;
}
.entry .peek {
  flex: 1 1 auto;
  font-size: 14px;
  color: var(--ink-faint);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.entry.open .peek { display: none; }
.entry .full { display: none; flex: 1 1 auto; font-size: 15px; line-height: 1.9; color: var(--ink); }
.entry.open .full { display: block; }
.entry .full .line { display: block; }
.entry .full .line.strong { color: var(--lamp); }
.entry .full .note {
  display: block;
  margin-top: 8px;
  font-size: 12.5px;
  color: var(--ink-faint);
}

.diary .foot {
  flex: 0 0 auto;
  padding: 10px 18px 14px;
  border-top: 1px solid #23252e;
  font-size: 12.5px;
  color: var(--ink-faint);
  text-align: center;
}
.diary .foot.ready { color: var(--blue); }

/* ==========================================================================
   标题页 / 选线页
   ========================================================================== */

.page {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  padding: 30px var(--pad);
}

/* ---- 标题页 ---- */
.title-grid {
  display: grid;
  grid-template-columns: 1.15fr .85fr;
  gap: 30px;
  align-items: start;
  min-height: 100%;
}

.title-main { display: flex; flex-direction: column; justify-content: center; padding-top: 8px; }

.title-main .kicker {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .3em;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 22px;
}
.title-main h1 {
  margin: 0 0 6px;
  font-size: 46px;
  line-height: 1.15;
  letter-spacing: .1em;
  font-weight: 400;
  color: var(--ink);
}
.title-main .sub {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .34em;
  color: var(--ink-faint);
  text-transform: uppercase;
  margin-bottom: 26px;
}
.title-main .pitch {
  font-size: 16px;
  line-height: 2;
  color: var(--ink-dim);
  max-width: 34em;
  margin: 0 0 30px;
}
.title-main .pitch em { font-style: normal; color: var(--ink); }

.start {
  align-self: flex-start;
  display: inline-flex;
  align-items: center;
  gap: 12px;
  font-family: inherit;
  font-size: 17px;
  letter-spacing: .14em;
  color: #0b0d12;
  background: var(--blue);
  border: none;
  border-radius: 2px;
  padding: 14px 34px;
  cursor: pointer;
  transition: background .16s, transform .1s;
}
.start:hover { background: #7aa5bd; }
.start:active { transform: translateY(1px); }
.start .arrow { font-family: var(--mono); font-size: 13px; }

.resume {
  align-self: flex-start;
  margin-top: 12px;
  font-family: inherit;
  font-size: 13px;
  color: var(--ink-faint);
  background: none;
  border: none;
  border-bottom: 1px dashed var(--base);
  padding: 2px 0;
  cursor: pointer;
  letter-spacing: .04em;
}
.resume:hover { color: var(--blue); border-color: var(--blue); }

/* ---- 右侧：声明与资源 ---- */
.title-side {
  border-left: 1px solid var(--wall-dark);
  padding: 4px 0 4px 26px;
  font-size: 13.5px;
  line-height: 1.85;
  color: var(--ink-dim);
}
.title-side h3 {
  margin: 0 0 10px;
  font-size: 12px;
  font-weight: 400;
  letter-spacing: .2em;
  color: var(--ink-faint);
  font-family: var(--mono);
  text-transform: uppercase;
}
.title-side p { margin: 0 0 12px; }
.title-side .disc { color: var(--ink); }
.title-side hr { border: none; border-top: 1px solid var(--wall-dark); margin: 18px 0; }

.hotline {
  margin-top: 4px;
  padding: 13px 16px;
  background: #1a1c24;
  border-left: 2px solid #a4463f;
  border-radius: 1px;
}
.hotline .n {
  font-family: var(--num);
  font-size: 21px;
  font-weight: 500;
  letter-spacing: .04em;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
  display: block;
  margin: 2px 0 8px;
}
.hotline .n:last-child { margin-bottom: 0; }
.hotline .n small {
  display: block;
  font-family: var(--sans);
  font-size: 12px;
  letter-spacing: .04em;
  color: var(--ink-faint);
  margin-top: 2px;
}

/* ---- 选线页 ---- */
.choose-head { margin-bottom: 24px; }
.choose-head .kicker {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .28em;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 12px;
}
.choose-head h2 {
  margin: 0 0 8px;
  font-size: 26px;
  font-weight: 400;
  letter-spacing: .06em;
}
.choose-head p { margin: 0; color: var(--ink-dim); font-size: 14.5px; max-width: 44em; }

.lines { display: flex; flex-direction: column; gap: 12px; }

.line-card {
  position: relative;
  display: flex;
  gap: 20px;
  align-items: center;
  width: 100%;
  text-align: left;
  font-family: inherit;
  background: #191b23;
  border: 1px solid var(--base);
  border-radius: 2px;
  padding: 18px 20px;
  cursor: pointer;
  transition: background .16s, border-color .16s, transform .1s;
}
.line-card[data-ready="true"]:hover {
  background: #1f2330;
  border-color: var(--blue-dim);
  transform: translateX(3px);
}
.line-card[data-ready="false"] { cursor: not-allowed; opacity: .42; }
.line-card[data-ready="false"]:hover { opacity: .52; }

.line-card .num {
  flex: 0 0 auto;
  font-family: var(--mono);
  font-size: 30px;
  line-height: 1;
  color: var(--blue-dim);
  width: 1.5em;
  text-align: center;
}
.line-card[data-ready="true"] .num { color: var(--blue); }

.line-card .meta { flex: 1 1 auto; min-width: 0; }
.line-card .meta h3 {
  margin: 0 0 5px;
  font-size: 18px;
  font-weight: 400;
  letter-spacing: .06em;
  color: var(--ink);
}
.line-card .meta .who {
  font-size: 12.5px;
  color: var(--ink-faint);
  letter-spacing: .03em;
  margin-bottom: 7px;
  font-family: var(--mono);
}
.line-card .meta .what { font-size: 14.5px; color: var(--ink-dim); }

.line-card .badge {
  flex: 0 0 auto;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: .18em;
  padding: 4px 10px;
  border: 1px solid var(--base);
  border-radius: 1px;
  color: var(--ink-faint);
  text-transform: uppercase;
}
.line-card[data-ready="true"] .badge { color: var(--blue); border-color: var(--blue-dim); }
.line-card[data-done="true"] .badge { color: var(--lamp); border-color: #7a6a3a; }

/* 剪影：没写的两条线，用一条人的形状占位，不假装能玩 */
.silhouette {
  position: absolute;
  right: 22px;
  bottom: 14px;
  width: 40px;
  height: 40px;
  opacity: .5;
  pointer-events: none;
}

/* ==========================================================================
   转场
   ========================================================================== */

#fade {
  position: fixed;
  inset: 0;
  z-index: 30;
  background: #06070a;
  opacity: 0;
  pointer-events: none;
  transition: opacity .5s ease;
}
#fade.on { opacity: 1; }

/* ==========================================================================
   焦点 / 键盘 / 小屏 / 减弱动效
   ========================================================================== */

:focus-visible {
  outline: 2px solid var(--lamp);
  outline-offset: 3px;
}

/* 窄屏：右栏挪到主栏下面，房间满宽 */
@media (max-width: 820px) {
  .title-grid { grid-template-columns: 1fr; gap: 26px; }
  .title-side { border-left: none; border-top: 1px solid var(--wall-dark); padding: 22px 0 0; }
  .title-main h1 { font-size: 34px; }
  #text { font-size: 17px; }
}

@media (max-height: 620px) {
  #text { font-size: 17px; min-height: 3em; }
  #panel { padding-top: 12px; }
  .title-main h1 { font-size: 34px; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
  .paper, .diary { animation: none; }
}

/* 打印/无脚本时的兜底，别让页面白屏 */
.noscript {
  padding: 40px var(--pad);
  color: var(--ink-dim);
  font-size: 15px;
  line-height: 2;
}

/* 小节末的督导笔记：一条一行，带序号 */
.tally.notes li { align-items: flex-start; }
.tally.notes .n {
  flex: 0 0 auto;
  min-width: 1.4em;
  color: #b08c3c;
  font-size: 13px;
  padding-top: 3px;
}
.tally.notes .v { line-height: 1.8; }
</style>
</head>

<script>
/* ===== src/sprites.js ===== */
// 立绘 + 场景时段变体。
// 方案 B 冻结的是「空房间」，没有画人；这里补上两个人和几处随剧情变的东西。
//
// 坐标系统一：和方案 B 一样，每个字符 = 1 个逻辑像素，空格 = 透明，106 × 60 的画布。
// 渲染时不做缩放，所以人必须画在房间尺度的像素上。
// 立绘风格参考《元气骑士》：头占比大、一圈深色描边、平涂色块、四肢短粗。

// ============================================================================
// 引擎：状态机 + 存档 + 场景渲染
// 这一层不认识任何剧情内容，只认识 story 数据里的节点类型。
// ============================================================================

(function (X) {
  'use strict';

  // ---- 依赖 src/sprites.js / src/story.js ----
  const S = X.sprites;              // { size, pal, sprites, shadows, scene, items, notes }
  const PAL = Object.assign({}, S.pal, X.PAL_EXT);
  const SAVE_KEY = 'xlzx.save.v1';

  // 房间里的箭头标注。
  //
  // 以前这里是"可点物件"：物品带光晕，点一下弹一张科普纸。现在改成**直接标在
  // 房间里**——三条故事线共用同一间咨询室，所以位置写死在这里，只有文字跟着
  // 故事数据走（见 ui.js 的 currentCallouts）。
  //
  //   anchor  箭头尖端指到的位置（逻辑像素）
  //   box     文字框左上角（逻辑像素）
  //
  // 选择落位的要求：箭头尽量短、文字框互相不压、不出画面。房间 106×60，
  // 各物品的坐标见 src/sprites.js 与 docs/mockups/方案B-内联SVG.html。
  const CALLOUTS = [
    { id: 'clock',    anchor: [48, 5],    box: [50, 0.4] },
    { id: 'referral', anchor: [44, 34],   box: [36, 19.2] },
    { id: 'tissue',   anchor: [51.5, 39], box: [42, 50.4] },
    { id: 'sofa',     anchor: [79, 42],   box: [80, 36] },
  ];

  // --------------------------------------------------------------------------
  // 存档
  // --------------------------------------------------------------------------
  function emptySave() {
    return {
      v: 1,
      done: { sci: false, amp: false, pain: false },
      current: null,
      lastPlayed: 0,
    };
  }

  let save = emptySave();

  function load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return;
      const parsed = JSON.parse(raw);
      // 存档结构带版本号；对不上的直接丢，不要让白屏
      if (!parsed || parsed.v !== 1) return;
      save = Object.assign(emptySave(), parsed);
      save.done = Object.assign({ sci: false, amp: false, pain: false }, parsed.done || {});
    } catch (e) {
      // file:// 下某些浏览器会直接抛异常。存档不是必需品，静默降级。
      save = emptySave();
    }
  }

  function persist() {
    save.lastPlayed = Date.now();
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* 无痕模式等，忽略 */ }
  }

  // --------------------------------------------------------------------------
  // 状态机
  // --------------------------------------------------------------------------
  const state = {
    screen: 'title',      // title | choose | story | end
    story: null,          // 当前故事对象
    line: null,           // 当前节点 id，形如 's1/n2'
    node: null,           // 当前节点对象
    flags: {},
    choices: [],
    itemsSeen: [],
    cardsSeen: [],
    diaryRead: [],
    warmth: 1,
    act: 1,
    scene: 'room',        // room | hallway —— 中场休息去走廊时换场景
    screenMode: 'title',
  };

  /** 分节 → 节点。's1' → { id, title, nodes } */
  function sectionOf(story, id) { return story.sections.find((s) => s.id === id); }

  /**
   * 按 id 取故事对象。
   * 原先这里写死成 'sci'，加第二条线就会静默失败（读档读不回来）。
   * 现在从一份注册表里查，加线只要往 XLZX.stories 里放一份。
   */
  function storyById(id) {
    return (X.stories || {})[id] || null;
  }

  // 故事注册表。加一条线只要往这里加一项，UI 不需要改。
  X.stories = X.stories || {};
  if (X.storySci) X.stories[X.storySci.id] = X.storySci;
  if (X.storyAmp) X.stories[X.storyAmp.id] = X.storyAmp;
  if (X.storyPain) X.stories[X.storyPain.id] = X.storyPain;

  /**
   * 解析跳转目标。
   * 规则（和 docs/design 里写的一致）：
   *   'n2'      → 本节的 n2
   *   '@s2/n1'  → 绝对，s2 节的 n1
   *   'end/1'   → 终章第 1 个节点（终章是独立节点表）
   */
  function resolve(story, fromId, target) {
    if (!target) return null;
    if (target.charAt(0) === '@') return target.slice(1);
    if (target.indexOf('/') >= 0) return target;
    return fromId.split('/')[0] + '/' + target;
  }

  function getNode(story, id) {
    if (!id) return null;
    const slash = id.indexOf('/');
    const secId = id.slice(0, slash);
    const key = id.slice(slash + 1);
    if (secId === 'end') return (story.endingNodes || {})[key] || null;
    const sec = sectionOf(story, secId);
    return sec ? sec.nodes[key] || null : null;
  }

  /** 当前节点属于第几节（用来显示章节名、切房间时段） */
  function sectionMeta(story, id) {
    if (!id) return null;
    const secId = id.split('/')[0];
    if (secId === 'end') return { id: 'end', title: '终章', subtitle: '这一节之后' };
    return sectionOf(story, secId) || null;
  }

  function snapshot() {
    return {
      story: state.story ? state.story.id : null,
      line: state.line,
      flags: JSON.parse(JSON.stringify(state.flags)),
      choices: state.choices.slice(),
      itemsSeen: state.itemsSeen.slice(),
      cardsSeen: state.cardsSeen.slice(),
      diaryRead: state.diaryRead.slice(),
      warmth: state.warmth,
      act: state.act,
      scene: state.scene,
    };
  }

  function restore(snap) {
    if (!snap || !snap.story) return false;
    const story = storyById(snap.story);
    if (!story) return false;
    state.story = story;
    state.line = snap.line;
    state.flags = snap.flags || {};
    state.choices = snap.choices || [];
    state.itemsSeen = snap.itemsSeen || [];
    state.cardsSeen = snap.cardsSeen || [];
    state.diaryRead = snap.diaryRead || [];
    state.warmth = snap.warmth || 1;
    state.act = snap.act || 1;
    state.scene = snap.scene || 'room';
    state.node = getNode(story, state.line);
    return !!state.node;
  }

  /** 走向下一个节点。target 省略时用当前节点的 next。 */
  function go(target) {
    const next = target === undefined ? state.node && state.node.next : target;
    if (next === null || next === undefined) return null;
    const id = resolve(state.story, state.line, next);
    const node = getNode(state.story, id);
    if (!node) {
      // 数据写错了不该让玩家白屏：停在原地，控制台留话
      console.warn('[心理咨询] 跳转落空：', state.line, '→', next, '（解析成', id, '）');
      return null;
    }
    state.line = id;
    state.node = node;
    return node;
  }

  /** 应用节点的副作用。effect 可累加，用 '+' 分隔。 */
  function applyEffects(node) {
    if (!node || !node.effect) return;
    node.effect.split('+').forEach(function (raw) {
      const eff = raw.trim();
      if (!eff) return;
      if (eff === 'crisis') state.flags.crisisTriggered = true;
      else if (eff === 'markScreenMissed') state.flags.screenMissed = true;
      else if (eff === 'unlockDiary') state.flags.diaryUnlocked = true;
      else state.flags[eff] = true;
    });
  }

  /** 进到某个节点时的统一处理：切时段、记卡片、落盘 */
  function enter(node) {
    if (!node) return;
    if (typeof node.act === 'number') state.act = node.act;
    if (typeof node.warmth === 'number') state.warmth = node.warmth;
    // scene 是"当前所处场景"。默认回到咨询室，只有节点明确写 scene 才换。
    // （否则走廊场景会一直留在状态里，回到咨询室还显示空房间。）
    state.scene = node.scene || 'room';
    applyEffects(node);
    // 副作用是"存档状态"的一部分，进节点就落盘。
    // 不落的话：走到危机关怀分支时关掉页面，或者从标题页看上次进度，
    // 那次危机触发就丢了——成绩单会说「你问了，他答了」，而实际上你接住了他。
    //
    // 这里直接写 save.current，**不要调 saveCurrent()**：那个函数挂在下面的
    // X.engine 对象字面量上，这时候还没赋值（函数声明会提升，函数表达式不会）。
    if (node.effect) {
      save.current = snapshot();
      persist();
    }
    // 节点上挂的卡（say + note）
    if (node.note && node.kind) recordCard(node.kind, node.text);
  }

  function recordCard(kind, text) {
    const key = kind + ':' + String(text || '').slice(0, 18);
    if (state.cardsSeen.indexOf(key) < 0) state.cardsSeen.push(key);
  }

  function recordChoice(nodeId, option) {
    state.choices.push({ node: nodeId, key: option.key, label: option.label });
    if (option.flag) state.flags[option.flag] = true;
  }

  function recordItem(itemId) {
    if (state.itemsSeen.indexOf(itemId) < 0) state.itemsSeen.push(itemId);
  }

  function recordDiary(entryId) {
    if (state.diaryRead.indexOf(entryId) < 0) state.diaryRead.push(entryId);
  }

  // --------------------------------------------------------------------------
  // 场景渲染
  // --------------------------------------------------------------------------

  /**
   * 背景：墙 / 护墙板 / 踢脚线 / 木地板。
   *
   * 这一层是「房间」而不是「家具」的骨架，所以它决定整幅画的**明度层次**：
   *   亮墙（. ,）→ 中间调护墙板（-）→ 过渡踢脚线（=）→ 中深地板（# ｜ +）
   * 早先地板和家具落在同一档明度上（都是近黑褐），两者糊成一片，
   * 所以看起来像把家具"贴"在墙纸上，而不是站在房间里。
   *
   * 另一处刻意的选择：**靠窗一侧更亮**。同一面墙从左到右有一个很轻的
   * 渐变，地板也一样——这是让"光从窗户进来"这件事在背景层就成立，
   * 而不是只靠最后一层半透明暖色硬叠。
   */
  const FLOOR_TOP = 34;        // 踢脚线所在行
  const WAINSCOT = 26;         // 护墙板分界：往上亮墙、往下略深

  /** 便宜的确定性哈希（0..n-1）。用来做不规则木纹，别用随机——同一帧要可复现。 */
  function hash2(x, y) {
    let n = (x * 374761393 + y * 668265263) | 0;
    n = (n ^ (n >> 13)) * 1274126177 | 0;
    return Math.abs(n ^ (n >> 16));
  }

  function bgChar(x, y) {
    if (y < FLOOR_TOP) {
      // ---- 墙 ----
      // 靠窗（左侧）一带略亮，向右极轻微压暗：让"光从窗户进来"在背景层就成立
      const shade = x >= 40;
      if (y >= WAINSCOT) return shade ? '-' : ',';
      // 细竖纹壁纸：每 5 px 一道。太密的话 6 倍放大后会跳。
      if (x % 5 === 0) return ',';
      return shade ? ',' : '.';
    }
    if (y === FLOOR_TOP) return '=';   // 踢脚线

    // ---- 木地板 ----
    // 走过的两次弯路，记下来免得再犯：
    //   1. 每 4 行横缝 + 每 13 列竖缝 → 读成瓷砖
    //   2. 纯哈希散点 → 读成地面脏了
    // 木头真正可读的特征是**方向性**：纹路顺着板长走。所以这里用"横向短纹"
    // 加"稀疏板端竖缝"，两者错开，才有木地板的读感。
    const h = hash2(x, y);
    const course = y - FLOOR_TOP;

    // 板端：稀疏的短竖缝（相邻层错开，且不通长）
    const seamShift = (course & 1) ? 6 : 0;
    if ((x + seamShift) % 19 === 0) return '|';

    // 木纹：顺着板长方向的短横道。
    // 关键是不能用"当前像素的哈希"决定自己画不画——那只会画出单点。
    // 改为：每 6 px 放一个**锚点**，由锚点的哈希决定这一道的起点与长度。
    const anchor = x - (((x % 11) + 11) % 11);
    const ah = hash2(anchor, y);
    if (ah % 9 === 0) {
      const start = anchor + (ah % 3);
      const len = 2 + (ah % 4);          // 2–5 px
      if (x >= start && x < start + len) return '+';
    }

    // 极稀疏的木节，打破均匀（只要几个）
    if (h % 211 === 0) return '|';

    return '#';
  }

  const NS = 'http://www.w3.org/2000/svg';

  function el(name, attrs) {
    const e = document.createElementNS(NS, name);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  function px(x, y, w, h, fill, opacity) {
    const a = { x: x, y: y, width: w, height: h, fill: fill };
    if (opacity !== undefined) a.opacity = opacity;
    if (x < 0 || y < 0) return null;
    return el('rect', a);
  }

  /** 把一个字符地图画进 parent。空字符串和调色板外的字符当透明。 */
  function paint(map, ox, oy, parent) {
    if (!map) return;
    map.forEach(function (line, dy) {
      let x = 0;
      while (x < line.length) {
        const ch = line.charAt(x);
        if (ch === ' ' || !PAL[ch]) { x++; continue; }
        let w = 1;
        while (line.charAt(x + w) === ch) w++;
        const r = px(ox + x, oy + dy, w, 1, PAL[ch]);
        if (r) parent.appendChild(r);
        x += w;
      }
    });
  }

  /** 找出眼睛所在的行（含瞳或眼镜框的那一行）。找不到返回 -1。 */
  function eyeRowOf(map) {
    for (let y = 0; y < map.length; y++) {
      if (map[y] && map[y].indexOf('X') >= 0) return y;
    }
    return -1;
  }

  /** 把一行像素画进某个分组 */
  function paintRow(line, ox, oy, parent) {
    let x = 0;
    while (x < line.length) {
      const ch = line.charAt(x);
      if (ch === ' ' || !PAL[ch]) { x++; continue; }
      let w = 1;
      while (line.charAt(x + w) === ch) w++;
      const r = px(ox + x, oy, w, 1, PAL[ch]);
      if (r) parent.appendChild(r);
      x += w;
    }
  }

  /**
   * 画一个人。
   *
   * 结构：
   *   <g class="x-person">   整个人的刚体 —— 呼吸时头和躯干一起搬
   *     <g>                  全部像素原样画出（含眼睛，作为底）
   *     <rect class="x-eye">  一块肤色"眼皮"，只盖住两眼之间那一段
   *   </g>
   *
   * 两个曾经踩过的坑，决定了现在这个形状：
   *
   * 1) 第一版把头和躯干拆成两个各自动画的组、周期还不同 → 相位错开 1px，
   *    接缝裂开（"头皮分离"）。所以整个人必须是一个刚体。
   *
   * 2) 第二版让"眼睛那一行"整行下移 1px 来闭眼。但那一行里**不只有眼睛**，
   *    还含着发帘下缘（H）与描边（D）：整行一动，发帘原位就露出空隙，
   *    额头处裂开一条缝。所以现在**位移全部取消**，只在眼睛跨度上盖一块
   *    肤色的矩形，用透明度切换来表示闭眼。位移为零 → 任何地方都不可能裂。
   */
  function paintPerson(map, ox, oy, parent, who) {
    if (!map) return;
    const person = el('g', { class: 'x-person x-' + who });
    const solid = el('g', {});

    // 全部像素原样画进实体层
    map.forEach(function (line, dy) { paintRow(line, ox, oy + dy, solid); });
    person.appendChild(solid);

    // 眼皮：只覆盖眼睛所在的那一段（从最左的瞳到最右的瞳）
    const eyeRow = eyeRowOf(map);
    if (eyeRow >= 0) {
      const row = map[eyeRow];
      const xs = [];
      for (let i = 0; i < row.length; i++) if (row.charAt(i) === 'X') xs.push(i);
      if (xs.length) {
        const x0 = xs[0];
        const x1 = xs[xs.length - 1];
        // 眼皮颜色取这一行里"眼睛旁边"的肤色，保证和周围一致
        let skin = null;
        for (let i = 0; i < row.length; i++) {
          const c = row.charAt(i);
          if (c !== ' ' && c !== 'X' && (c === 'Z' || c === 'z')) { skin = c; break; }
        }
        if (skin && PAL[skin]) {
          const lid = px(ox + x0, oy + eyeRow, x1 - x0 + 1, 1, PAL[skin]);
          if (lid) {
            lid.setAttribute('class', 'x-eye x-' + who);
            person.appendChild(lid);
          }
        }
      }
    }

    parent.appendChild(person);
  }

  // 人物待机动效：呼吸起伏 + 眨眼。
  //
  // ⚠️ 三条硬约束，每条都是踩过坑之后定下的：
  //
  // 1) **像素画不能用小数位移。**
  //    translateY(-0.3px) 会把每格边缘插值成半透明，6 倍放大后整张脸发虚。
  //    所以位移一律整像素，用 step-end 让位置"跳"。
  //
  // 2) **头和躯干必须同一个刚体。**
  //    第一版把 .x-head / .x-body 拆开、给了不同周期（5.5s vs 4s），
  //    相位错开 1px，接缝裂开（表现为"头皮分离"）。
  //    人的头颈相连，动效必须把整个人当一个整体搬。
  //
  // 3) **眨眼不能移动像素，只能覆盖。**
  //    第二版让"眼睛那两行"整行下移 1px 来闭眼。但眼睛行 r4 里还含着
  //    发帘下缘的像素：整行下移后，发帘原位露出来了 —— 额头处裂开 1px 缝。
  //    现在改成：眼睛行在实体层正常画（作为底），另起一层 .x-eye 把同一行
  //    再画一遍并盖在上面；眨眼时把这一层藏起来，露出的就是底下那张脸。
  //    位移为零，所以任何地方都不可能裂。
  const ANIM_RULES =
    // 整个人：呼吸。头与躯干一起动，接缝不会裂。
    '.x-person{animation:xl-breathe 4s step-end infinite;transform-box:fill-box;transform-origin:50% 100%}' +
    '@keyframes xl-breathe{0%,45%{transform:translateY(0)}46%,75%{transform:translateY(-1px)}76%,100%{transform:translateY(0)}}' +
    // 眨眼：眼睛覆盖层藏起来 = 闭眼。只动透明度，不动位置。
    '.x-eye{animation:xl-blink 6s step-end infinite}' +
    '@keyframes xl-blink{0%,92%{opacity:0}93%,95%{opacity:1}96%,97.5%{opacity:0}98%,99%{opacity:1}100%{opacity:0}}' +
    '@media (prefers-reduced-motion:reduce){' +
    '.x-person,.x-eye{animation:none;opacity:1;transform:none}}';

  /**
   * 箭头标注：指引线（带箭头）+ 两行文字框（物品名 / 功能）。
   *
   * 文字框故意不透明，会盖住后面的像素画——标注要能读，
   * 压住一点家具比糊在地板花纹上强。箭头从文字框离物品最近的那条边出发。
   */
  function drawCallouts(svg, list) {
    if (!list || !list.length) return;
    const g = el('g', { class: 'ann', style: 'shape-rendering:auto' });
    // 箭头用 marker，省得自己算三角形。同一屏只有一个 #scene，id 不冲突。
    const defs = el('defs', {});
    const marker = el('marker', {
      id: 'ann-arrow', markerUnits: 'userSpaceOnUse',
      markerWidth: 3, markerHeight: 3, refX: 2.6, refY: 1.5, orient: 'auto',
    });
    marker.appendChild(el('path', { d: 'M0,0 L3,1.5 L0,3 z', fill: '#ffe0a8' }));
    defs.appendChild(marker);
    g.appendChild(defs);

    const NAME_FS = 2.5, TEXT_FS = 3.2, PAD_X = 1.4, PAD_Y = 1.0, LINE_H = 3.8;

    list.forEach(function (a) {
      const geo = CALLOUTS.find(function (c) { return c.id === a.id; });
      if (!geo) return;
      const name = a.name || '';
      const text = a.text || '';
      // 中文字宽≈字号，按字数估宽度即可（不依赖字体度量，file:// 下也稳）。
      const w = Math.max(name.length * NAME_FS, text.length * TEXT_FS) + PAD_X * 2;
      const h = PAD_Y * 2 + LINE_H * 2 - 0.6;
      const bx = geo.box[0], by = geo.box[1];
      const ax = geo.anchor[0], ay = geo.anchor[1];

      // 从离 anchor 最近的那条边走线，箭头才不会穿过文字框。
      let ex, ey;
      if (ax < bx) { ex = bx; ey = Math.min(Math.max(ay, by), by + h); }
      else if (ax > bx + w) { ex = bx + w; ey = Math.min(Math.max(ay, by), by + h); }
      else { ey = ay < by ? by : by + h; ex = Math.min(Math.max(ax, bx + 1.6), bx + w - 1.6); }
      g.appendChild(el('line', {
        x1: ex, y1: ey, x2: ax, y2: ay,
        stroke: '#ffe0a8', 'stroke-width': 0.4, 'marker-end': 'url(#ann-arrow)',
      }));

      // 文字框
      g.appendChild(el('rect', {
        x: bx, y: by, width: w, height: h, rx: 0.9,
        fill: 'rgba(22,16,11,0.9)', stroke: '#8f6636', 'stroke-width': 0.3,
      }));
      const nm = el('text', {
        x: bx + PAD_X, y: by + PAD_Y + 2.0,
        'font-size': NAME_FS, fill: '#b6ab9c', 'font-family': 'inherit',
      });
      nm.textContent = name;
      g.appendChild(nm);
      const tx = el('text', {
        x: bx + PAD_X, y: by + PAD_Y + 2.0 + LINE_H,
        'font-size': TEXT_FS, fill: '#ffe0a8', 'font-weight': 600, 'font-family': 'inherit',
      });
      tx.textContent = text;
      g.appendChild(tx);
    });

    svg.appendChild(g);
  }

  /**
   * 画整个房间，按方案 B 的层级。
   * @param {object} opts
   *   act          1..3，决定钟针位置
   *   warmth       1..3，决定暖光和压暗
   *   withPeople   有没有人（第 1 节的走廊场景没有人）
   *   callouts     [{id,name,text}] 要在房间里标出来的物品；空数组 = 不标
   */
  function renderScene(opts) {
    const act = opts.act || 1;
    const warmth = opts.warmth || 1;
    const withPeople = opts.withPeople !== false;
    const hallway = !!opts.hallway;
    const svg = el('svg', { id: 'scene', viewBox: '0 0 ' + S.size.w + ' ' + S.size.h });
    const GW = S.size.w;
    const GH = S.size.h;
    // 随身物件与立绘由故事数据决定（故事线一是轮椅，二是双拐）。
    const art = (state.story && state.story.clientArt) || null;

    // --- 0) 动画规则写在 SVG 内部，用 class 选择器，别被页面的 CSS 覆盖 ---
    const style = el('style', {});
    style.textContent = ANIM_RULES;
    svg.appendChild(style);

    // --- 1) 墙 / 踢脚线 / 地板 ---
    const bg = el('g', {});
    for (let y = 0; y < GH; y++) {
      let x = 0;
      while (x < GW) {
        const ch = bgChar(x, y);
        let w = 1;
        while (x + w < GW && bgChar(x + w, y) === ch) w++;
        bg.appendChild(px(x, y, w, 1, PAL[ch]));
        x += w;
      }
    }
    svg.appendChild(bg);

    // --- 2) 墙脚接触阴影 + 家具落地影 ---
    svg.appendChild(px(0, 35, GW, 2, '#0e0f16', 0.35));
    // 注意别把回调参数命名成 warmth / act / withPeople —— 会把外层的同名参数遮住
    S.shadows.forEach(function (box) {
      svg.appendChild(px(box[0], box[1], box[2], box[3], '#0e0f16', 0.42));
    });

    // --- 3) 家具 + 人 + 茶几上的东西 ---
    //     人物排在沙发之后、茶几之前：这样手能搭在沙发扶手上，
    //     而茶几和上面那盒纸巾、那张转介单会挡住两人的下缘。
    const scene = S.scene;
    scene.forEach(function (row) {
      if (row[0] === 'clock') return;                        // 钟按小节换指针，最后单独画
      if (row[0] === 'table') return;                        // 茶几要压在人上面
      if (row[0] === 'cup' && withPeople) return;            // 有人时杯子被挡着
      paint(S.sprites[row[0]], row[1], row[2], svg);
    });

    if (withPeople) {
      // 随身物件与立绘由故事数据决定：故事线一是轮椅，故事线二是双拐。
      // 写死的话，第二条线会画出别人的轮椅。
      if (art) {
        paint(X[art.prop], art.propX, art.propY, svg);
        paintPerson(X[art.body], art.bodyX, art.bodyY, svg, 'client');
      } else {
        const c = X.CHARS.client;
        paint(X.WHEELCHAIR, c.chairX, c.chairY, svg);
        paintPerson(c.body, c.bodyX, c.bodyY, svg, 'client');
      }
      const k = X.CHARS.counselor;
      paintPerson(k.body, k.bodyX, k.bodyY, svg, 'counselor');
    }

    // 茶几（压在人腿上）
    const tableRow = scene.find(function (r) { return r[0] === 'table'; });
    if (tableRow) paint(S.sprites.table, tableRow[1], tableRow[2], svg);

  function make(tag, attrs, kids) {
    const el = document.createElement(tag);

      if (k === 'class') el.className = attrs[k];
      else if (k === 'text') el.textContent = attrs[k];
      else if (k === 'html') el.innerHTML = attrs[k];
      else if (attrs[k] !== null && attrs[k] !== undefined) el.setAttribute(k, attrs[k]);

    (kids || []).forEach(function (c) { if (c) el.appendChild(c); });

  /**
   * 把文字一段一段写出来。返回一个 { done(), skip() } 句柄。
   * 用 Array.from 而不是 charAt——中文和标点各占一个码点，substring 会切坏。
   */
  function typewrite(container, text, opts) {
    opts = opts || {};
    const speed = opts.speed || 26;      // 每个字的毫秒数
    const container$ = container;
    container$.textContent = '';

    const chars = Array.from(text);
    const spans = chars.map(function (ch) {
      const s = document.createElement('span');
      s.className = 'w';
      s.textContent = ch;
      container$.appendChild(s);
      return s;
    });

    if (reduceMotion) {
      spans.forEach(function (s) { s.classList.add('on'); });
      return { done: function () { return true; }, skip: function () {} };
    }

    let i = 0;
    let finished = false;
    let timer = null;

    function step() {
      if (i >= spans.length) {
        finished = true;
        if (opts.onEnd) opts.onEnd();
        return;
      }
      const ch = chars[i];
      spans[i].classList.add('on');
      i++;
      // 标点处多停一下——不是匀速打字，是"写"的节奏
      let wait = speed;
      if ('。！？'.indexOf(ch) >= 0) wait = speed * 7;
      else if ('，、；：'.indexOf(ch) >= 0) wait = speed * 3.5;
      else if (ch === '\n') wait = speed * 4;
      timer = window.setTimeout(step, wait);
    }

    timer = window.setTimeout(step, speed);

    return {
      done: function () { return finished; },
      skip: function () {
        if (timer) window.clearTimeout(timer);
        spans.forEach(function (s) { s.classList.add('on'); });
        i = spans.length;
        finished = true;
        if (opts.onEnd) opts.onEnd();
      },
    };
  }

  function showPaper(o) {

    const actions = make('div', { class: 'actions' });

    actions.appendChild(btn);

    overlayEl.appendChild(paper);

    // 正文：督导笔记和转介单逐字写出来，科普卡直接给（它更长，等不起）
    const full = (o.lines || []).join('\n\n');
    let handle = null;
    if (o.write && !reduceMotion) {

      body.appendChild(wrap);

      if (o.onClose) o.onClose();
    }

    btn.addEventListener('click', function () {
      // 还没写完就点：先把字补完，再点一次才关
      if (handle && !handle.done()) { handle.skip(); return; }

    overlayEl.addEventListener('mousedown', function (ev) {

      if (handle && !handle.done()) return;

  /**
   * 房间按视口缩放。
   *
   * 布局比例 7:3：#stage 固定拿屏幕高度的 7/10（见 styles.css），
   * 房间填满这一份、并在里面居中。所以比例不再靠"给对话区留多少 px"来凑，
   * 而是房间直接按 #stage 的可用高度缩放——大了缩、小了放，居中留白。
   *
   * 注意：这里允许 factor > 1（房间可能被放大），因此不再追求整数倍。
   * 但放大只发生在"屏幕够宽、高度要填满"的场合，放大倍数很小（< 1.35），
   * 对 106×60 的小像素画来说基本看不出发虚。
   */
  function scaleRoom() {
    const room = $('#room');
    const wrap = $('#roomWrap');
    const stage = $('#stage');
    if (!room || !wrap || !stage) return;
    // 房间能用的高度：stage 的 content box（clientHeight 去掉上下 padding）。
    // 这样房间填满内容盒、居中，不碰那 14px 的上留白。
    const cs = window.getComputedStyle(stage);
    const availH = stage.clientHeight - parseFloat(cs.paddingTop || 0) - parseFloat(cs.paddingBottom || 0);
    // 房间能用的宽度：stage 的内容盒宽（房间不能比它更宽）
    const availW = stage.clientWidth;
    // 高度决定的比例，与宽度决定的比例，取小者，别让房间超出舞台
    let factor = Math.min(availH / 360, availW / 636);
    // 太小的时候也别缩没了，至少保个下限（基本不会触发）
    factor = Math.max(0.5, factor);
    room.style.transform = 'scale(' + factor.toFixed(3) + ')';
    wrap.style.height = Math.round(360 * factor) + 'px';
  }

  // --------------------------------------------------------------------------
  // 正文渲染
  // --------------------------------------------------------------------------
  function setWho(who, role) {
    const who$ = $('#who');
    who$.textContent = who || '';
    who$.setAttribute('data-role', role || who || '');
  }

  function clearChoices() {
    const c = $('#choices');
    if (c) { c.innerHTML = ''; c.style.display = 'none'; }
    awaitingChoice = false;
  }

  function setHint(text) {
    const hint = $('#hint');
    if (!hint) return;
    hint.innerHTML = '';
    if (text) {
      hint.appendChild(make('span', { class: 'dot' }));
      hint.appendChild(make('span', { text: text }));
    }
    const right = make('span', { class: 'right', text: '' });
    hint.appendChild(right);
  }

  function caretSlot() {
    const t = $('#text');
    const c = make('span', { class: 'caret', text: '▌' });
    t.appendChild(c);
    return c;
  }

  /** 画当前节点 */
  function renderSay(node) {
    if (state.screen !== 'story') return;
    renderTop(chapterLabel());
    renderRoom();

    const textEl = $('#text');
    clearChoices();

    paperOpen = false;
    const role = node.who || '旁白';
    setWho(role === '旁白' ? '' : role, role);

    // 带 note 的节点：整句就是"咨询师对玩家说的话"。
    // 用聊天气泡回一句——不拦路、不用点击；正文区让位，这句话只出现一次。
    // （否则同一句会大字号说一遍、气泡里又说一遍。）
    const chatText = node.note ? ((node.note && node.note.text) || node.text) : '';
    if (chatText) {
      if (typer) typer.skip();
      hideChat();
      showChat(chatText);
      // 正文区让位给气泡。点击/空格仍然照常推进——
      // textEl 虽然 display:none，但键盘那条路径是直接调 _advance 的。
      textEl.textContent = '';
      textEl.style.display = 'none';
      setWho('', '');
      setHint('');
      const r = $('#hint .right');
      if (r) r.textContent = '空格 / 点文字继续';
      const goNext = function () {
        if (paperOpen || awaitingChoice) return;
        textEl._advance = null;
        advance(node.next);
      };
      textEl.onclick = goNext;
      textEl._advance = goNext;
      return;
    }
    textEl.style.display = '';
    hideChat();
    const hasNote = false;   // 笔记不再进"本节末"清单（气泡已经说过一次）

    if (typer) typer.skip();

    if (!node.text) {
      textEl.textContent = '';
      advance(node.next);
      return;
    }

    const caret = caretSlot();
    let advanced = false;

    function allowAdvance() {
      const hintText = node.hint || '';
      setHint(hintText);
      const right = $('#hint .right');
      if (right) right.textContent = '空格 / 点文字继续';
    }

    function hit() {
      if (advanced || paperOpen || awaitingChoice) return;
      if (typer && !typer.done()) { typer.skip(); return; }  // 第一下：把字补完
      // 这里曾经是 `if (hasNote) return;`——因为那时笔记会弹一张纸、由纸来推进。
      // 笔记改成"本节末统一看"之后，这句会让**每一个带笔记的节点卡死**
      // （点不动，玩家走不下去）。笔记不再拦路，台词自己往下走。
      advanced = true;                                      // 第二下：往下走
      advance(node.next);
    }

    // **必须在启动打字机之前就挂上**。
    // 打字机跑的时候每次都重建了 #text 的内容，但 _advance 要是这时候还没挂，
    // 玩家在头一两秒里点文字就完全没反应——看起来像卡住了。
    textEl.onclick = hit;
    textEl._advance = hit;
    textEl._awaitingNote = false;

    typer = typewrite(textEl, node.text, {
      onEnd: function () {
        if (caret) caret.classList.remove('off');
        allowAdvance();
        // note 节点改用聊天气泡回复（见 renderSay 开头），这里不弹纸
      },
    });
    if (caret) caret.classList.add('off');

    if (node.next === null || node.next === undefined) allowAdvance();
  }

  /** 画一个选择点：先把提示句说出来，再挂选项 */
  function renderChoice(node) {
    if (state.screen !== 'story') return;
    renderTop(chapterLabel());
    renderRoom();

    if (typer) typer.skip();
    setWho('', '');

    const textEl = $('#text');
    textEl.onclick = null;
    textEl._advance = null;
    textEl.textContent = node.prompt || '';

    const choicesEl = $('#choices');
    choicesEl.innerHTML = '';
    choicesEl.style.display = '';
    hideChat();          // 选项一出来，上一条气泡就该收了
    awaitingChoice = true;

    node.options.forEach(function (opt, i) {
      const btn = make('button', { class: 'choice', type: 'button' });
      btn.appendChild(make('span', { class: 'key', text: String(i + 1) }));
      btn.appendChild(make('span', { class: 'label', text: opt.label }));
      btn.addEventListener('click', function () { X.ui.chooseOption(i); });
      choicesEl.appendChild(btn);
      if (i === 0) window.setTimeout(function () { btn.focus({ preventScroll: true }); }, 30);
    });

    setHint(node.hint || '');
    const right = $('#hint .right');
    if (right) right.textContent = '按 1–' + node.options.length + ' 也能选';
  }

  /** 总入口：按节点类型分派 */
  function renderNode() {
    if (state.screen !== 'story') return;
    const node = state.node;
    if (!node) return;

    if (node.type === 'choice') return renderChoice(node);
    if (node.type === 'say') return renderSay(node);

    // 以下是"纸"类的节点，正文区空着，靠弹层推进
    renderTop(chapterLabel());
    renderRoom();
    const textEl = $('#text');
    if (typer) typer.skip();
    textEl.onclick = null;
    textEl._advance = null;
    clearChoices();
    paperOpen = true;

    if (node.type === 'card') {
      setWho('', '');
      textEl.textContent = '';
      setHint('');
      showPaper({
        kind: node.kind || 'science',
        title: node.title,
        lines: node.lines,
        footer: node.footer,
        button: node.button,
        onClose: function () {
          paperOpen = false;
          if (node.ending) { finishStory(); return; }
          advance(node.next);
        },
      });
      return;
    }

    if (node.type === 'result') {
      setWho('', '');
      textEl.textContent = '';
      setHint('');
      showResult(node);
      return;
    }

    if (node.type === 'diary') {
      setWho('', '');
      textEl.textContent = '';
      setHint('');
      showDiary(node, function () { paperOpen = false; advance(node.next); });
      return;
    }
  }

  function chapterLabel() {
    const meta = E.sectionMeta(state.story, state.line);
    if (!meta) return '';
    return state.story.title + ' · ' + meta.title + (meta.subtitle ? ' · ' + meta.subtitle : '');
  }

  /**
   * 咨询师发来的一条「聊天气泡」。
   *
   * 为什么用气泡而不是台词区：这些文字是**对玩家说的**（第二人称，
   * 「你一上来就复述它，他就把你归到『他们』那边去了」），不是剧情里的台词。
   * 直接当旁白摆在台词区，读起来像游戏在后台点评；放进气泡、挂上咨询师的名字，
   * 就变成"咨询师在跟你说话"——玩家本来就是扮演这位咨询师的人。
   *
   * 它是「回一句」不是「弹一张纸」：立刻出现、不用点击、不拦路。
   * 选项正文已经把玩家刚才那句话带出来了，所以这里不再重复台词。
   */
  function showChat(text) {
    const host = $('#chat');
    if (!host) return null;
    host.innerHTML = '';
    host.style.display = '';
    // 让 #panel 从顶部排，气泡就落在台词该出现的位置
    if (host.parentNode) host.parentNode.classList.add('bubble-mode');
    const bubble = make('div', { class: 'bubble' });
    bubble.appendChild(make('div', { class: 'who', text: '咨询师' }));
    const body = make('div', { class: 'say' });
    bubble.appendChild(body);
    host.appendChild(bubble);
    // 窗口偏矮时气泡会落到看不见的地方（#text 藏着，那个空位把气泡顶下去了）。
    // 主动把它滚进视野——这是给玩家看的一句话，不能要他先滚动才看得到。
    // 放在计时器里：此刻还在布局，立即量位置会拿到旧值。
    window.setTimeout(function () {
      try { bubble.scrollIntoView({ block: 'nearest' }); } catch (e) { /* 老浏览器忽略 */ }
    }, 0);
    // 逐字写出来，和台词一个节奏，但用气泡的样式
    return typewrite(body, text, { speed: 22 });
  }

  function hideChat() {
    const host = $('#chat');
    if (!host) return;
    host.innerHTML = '';
    host.style.display = 'none';
    if (host.parentNode) host.parentNode.classList.remove('bubble-mode');
  }

  /** 取某一小节里所有带 note 的文字（按节点顺序）。 */
  function collectNotes(secId) {
    const story = state.story;
    if (!story || !story.sections) return [];
    const sec = story.sections.filter(function (x) { return x.id === secId; })[0];
    if (!sec) return [];
    const out = [];
    Object.keys(sec.nodes).forEach(function (k) {
      const n = sec.nodes[k];
      if (n && n.note) {
        const t = (n.note && n.note.text) || n.text;
        if (t && out.indexOf(t) < 0) out.push(t);
      }
    });
    return out;
  }

  /** 真正跳到目标节点（不做笔记拦截）。 */
  function advanceNow(target) {
    if (state.screen !== 'story') return;
    const before = state.line;
    const node = E.go(target);
    if (!node) return;
    const changed = before.split('/')[0] !== state.line.split('/')[0];
    E.enter(node);
    if (changed) transition(function () { renderNode(); });
    else renderNode();
    E.saveCurrent();
  }

  /**
   * 推进到下一个节点。
   *
   * 如果这一步跨到了下一小节，先把**刚走完那一节**的督导笔记给出来，再进下一节。
   *
   * 为什么"节末"只能钩在这里：三条线的小节收尾写法并不一致 ——
   *   线二、线三：节末是一个 result 节点（成绩单），按钮通向下一节；
   *   线一：节末就是一个普通 say 节点，next 直接写 '@s2/n1'，**根本没有成绩单**。
   * 所以把钩子挂在"成绩单的按钮"上只能覆盖前两条线，线一永远弹不出笔记
   * （走查里的 assert-note 抓到的正是这个）。
   *
   * 还有个坑：必须先取快照再让 E.go 执行。E.go 一跑，state.line 就变了，
   * 回头再按新的 line 去取上一节的笔记，只会取到空。
   */
  function advance(target) {
    if (state.screen !== 'story') return;
    const beforeSec = state.line.split('/')[0];
    // 先用解析器探一下目标落在哪一节，别真的跳过去
    let targetSec = '';
    try {
      const probe = E.resolve(state.story, state.line, target);
      targetSec = String(probe || '').split('/')[0];
    } catch (e) { targetSec = ''; }

    if (targetSec && beforeSec && targetSec !== beforeSec) {
      // 本节所有带 note 的节点，就是要给玩家看的"本节笔记"。
      // 直接从数据取，不依赖"玩家走到过哪些节点"——这样清单是完整的，
      // 与他在节内看到的那些气泡一致（气泡是一次一条，这里是汇总）。
      showSectionNotes(target, collectNotes(beforeSec));
      return;
    }
    advanceNow(target);
  }

  function transition(mid) {
    const fade = $('#fade');
    fade.classList.add('on');
    window.setTimeout(function () {
      mid();
      window.setTimeout(function () { fade.classList.remove('on'); }, 90);
    }, 480);
  }

  // --------------------------------------------------------------------------
  // 成绩单
  // --------------------------------------------------------------------------
  /** 成绩单只看一次：看过之后按钮改成"继续"，别一直让人以为还有新东西 */
  let resultSeen = false;


  /**
   * 把一张纸放进浮层，并在按钮点下之后执行 next。
   * 成绩单和"小节末的督导笔记"共用这个收尾。
   */
  function presentPaper(opts) {
    // 惰性建浮层：showPaper 早就这么做了，这里原先没有。
    // 一条线的第一张纸如果是「节末笔记」或「成绩单」（v2 的许予安线就是这样），
    // overlayEl 还是 null，会当场抛 TypeError。
    if (!overlayEl) {
      overlayEl = make('div', { id: 'overlay' });
      document.body.appendChild(overlayEl);
    }
    const paper = make('div', { class: 'paper', 'data-kind': opts.kind || 'science' });
    paper.appendChild(make('div', { class: 'head' }, [
      make('span', { class: 'label', text: opts.label || '' }),
      make('span', { class: 'rule' }),
    ]));
    if (opts.title) paper.appendChild(make('h2', { text: opts.title }));
    if (opts.lead) {
      paper.appendChild(make('p', { class: 'result-lead', text: opts.lead }));
    }
    const bodyWrap = make('div', { class: 'body' });
    bodyWrap.appendChild(opts.body);
    paper.appendChild(bodyWrap);

    const actions = make('div', { class: 'actions' });
    const btn = make('button', {
      class: 'btn primary', type: 'button', text: opts.button || '继续',
    });
    actions.appendChild(btn);
    paper.appendChild(actions);

    overlayEl.innerHTML = '';
    overlayEl.className = 'on';
    overlayEl.appendChild(paper);
    btn.focus({ preventScroll: true });
    btn.addEventListener('click', function () {
      closeOverlay();
      paperOpen = false;
      if (opts.onClose) opts.onClose();
    });
  }

  /**
   * 本节结束：把这一节里攒下的督导笔记一次性看完。
   *
   * 放在成绩单之后：成绩单回答"我做了什么"，笔记回答"为什么"。
   * 一次看完而不是每两句弹一张——后者把对话切得太碎，还引发过重复弹出。
   */
  function showSectionNotes(nextTarget, snapshot) {
    // snapshot 是"刚走完那一节"的笔记快照。
    // 必须由调用方传入：换节那一刻 state.line 已经指向下一节，
    // 这里再回去取只会取到空。
    const notes = snapshot || [];

    // 这一节一条笔记都没有：直接跳，别再走 advance——那会再次触发
    // "跨节"判断、又回到这里，形成死循环（第一次见面结束点不动就是这么来的）。
    if (!notes.length) { advanceNow(nextTarget); return; }

    const body = make('div', {});
    const ul = make('ul', { class: 'tally notes' });
    notes.forEach(function (text, i) {
      const li = make('li', {});
      li.appendChild(make('span', { class: 'n', text: String(i + 1) }));
      li.appendChild(make('span', { class: 'v', text: text }));
      ul.appendChild(li);
    });
    body.appendChild(ul);
    body.appendChild(make('p', {
      style: 'color:#6d6250;font-size:13.5px;margin-top:14px',
      text: '这些是刚才每一步背后的说法。不扣分，也不是唯一答案。',
    }));

    paperOpen = true;
    presentPaper({
      kind: 'supervision',
      label: '督导笔记 · 本节',
      title: '这一节的 ' + notes.length + ' 条旁注',
      body: body,
      button: '看完了',
      onClose: function () { advanceNow(nextTarget); },
    });
  }

  function showResult(node) {
    const flags = state.flags;
    const choices = state.choices;

    // 这一节真正发生了什么，全部从 choices / flags 里读出来，不写死。
    // v2：成绩单内容由**故事数据**给（result 节点的 rows），这里不再替某条线写死。
    // 老数据没有 rows 时，仍走下面这套（保留给历史线，删了也不会坏）。
    const builtin = [];
    const openB = flags.openB;
    builtin.push(['开场', openB ? '你先问他想聊什么，而不是复述转介单。'
      : flags.openA ? '你复述了转介单上「配合度差」那句。'
        : '你问了「最近怎么样」，换回一个安全答案。']);
    builtin.push(['保密例外', flags.askedBoundary
      ? '你把边界讲清楚了，他追问了一次——说明他听进去了。'
      : '你讲完了设置，但没确认他听懂没有。']);
    builtin.push(['王医生的托付', flags.ethB ? '你没替来访者做主，也没当面驳他。'
      : flags.ethA ? '你答应了一件不该由你答应的事。'
        : '你指出了医学事实，但那是你在走廊里替他定的调。']);
    builtin.push(['危机筛查', flags.screened
      ? (flags.crisisTriggered ? '你问了。他说了。你按写死的流程接住了他。' : '你问了，他答了。')
      : '你没问。这不扣分，但下次得问。']);

    const diaryRead = state.diaryRead.length;
    builtin.push(['情绪日记', diaryRead >= 4 ? '四条都看了。你从里头认出了自动化思维、个人化、读心术和回避。'
      : '你看了 ' + diaryRead + ' 条。剩下的没看，也就没谈。']);

    builtin.push(['「等我能走了」', flags.waiting ? '你没拆他的目标，你把「等」摆到了桌面上。'
      : flags.reality ? '你宣布了「接受现实」——目标是他的，不该由你说。'
        : '你抛回了一个太虚的问题，他接不住。']);

    const cards = state.cardsSeen.length;
    builtin.push(['看过的资料', cards + ' 张']);

    // 数据优先：result 节点给了 rows 就用它（v2 的做法）
    const lines = (typeof node.rows === 'function') ? node.rows(flags, state)
      : (Array.isArray(node.rows) ? node.rows : builtin);

    const body = make('div', {});
    if (!flags.screened) {
      body.appendChild(make('p', {
        style: 'color:#8a5a20;margin-bottom:14px',
        text: node.reminder
          || '提醒：这条线里你没有做危机筛查。抑郁很容易被身体的表现盖住——'
          + '「没劲儿」「不想动」「睡不好」太容易被当成身体的问题。下一次，得问。',
      }));
    }
    const ul = make('ul', { class: 'tally' });
    lines.forEach(function (pair) {
      const li = make('li', {});
      li.appendChild(make('span', { class: 'k', text: pair[0] }));
      const v = make('span', { class: 'v', text: pair[1] });
      if (/没问|不该|不安全|没看|接不住|复述/.test(pair[1])) v.className = 'v miss';
      li.appendChild(v);
      ul.appendChild(li);
    });
    body.appendChild(ul);

    body.appendChild(make('p', {
      style: 'color:#6d6250;font-size:13.5px;margin-top:14px',
      text: '同一件事有不止一种做法，没有哪一次选择会卡死。',
    }));

    const paper = make('div', { class: 'paper', 'data-kind': 'result' });
    paper.appendChild(make('div', { class: 'head' }, [
      make('span', { class: 'label', text: '成绩' }),
      make('span', { class: 'rule' }),
    ]));
    paper.appendChild(make('h2', { text: node.title }));
    if (node.lead) {
      // lead 用衬线，和台词分开——这是"结论"，不是"对话"
      paper.appendChild(make('p', {
        class: 'result-lead',
        text: node.lead,
      }));
    }
    const bodyWrap = make('div', { class: 'body' });
    bodyWrap.appendChild(body);
    paper.appendChild(bodyWrap);

    const actions = make('div', { class: 'actions' });
    const btn = make('button', {
      class: 'btn primary', type: 'button',
      text: resultSeen ? '继续' : (node.button || '继续'),
    });
    resultSeen = true;
    actions.appendChild(btn);
    paper.appendChild(actions);
    overlayEl.innerHTML = '';
    overlayEl.className = 'on';
    overlayEl.appendChild(paper);
    btn.focus({ preventScroll: true });
    btn.addEventListener('click', function () {
      closeOverlay();
      paperOpen = false;
      // 看完成绩单，接着把这一节的督导笔记一次性给出来
      showSectionNotes(node.next);
    });
  }

  // --------------------------------------------------------------------------
  // 通关
  // --------------------------------------------------------------------------
  function finishStory() {
    E.markDone(state.story.id);
    E.clearCurrent();
    state.screen = 'end';
    renderEnd();
  }

  function renderEnd() {
    renderTop('');
    const main = $('#main');
    const panel = $('#panel');
    panel.style.display = '';
    main.style.display = 'none';
    panel.innerHTML = '';

    panel.appendChild(make('div', { id: 'who' }));
    const h = make('div', {
      style: 'font-size:26px;letter-spacing:.06em;margin:0 0 14px',
      text: (state.story && state.story.end && state.story.end.heading) || '本节 · 完',
    });
    panel.appendChild(h);

    const text = make('div', {
      style: 'font-size:18px;line-height:1.95;color:#b9b5ac;max-width:38em',
      text: (state.story && state.story.end && state.story.end.closing) || '',
    });
    panel.appendChild(text);

    const row = make('div', { style: 'display:flex;gap:10px;margin-top:24px;flex-wrap:wrap' });
    const again = make('button', { class: 'btn primary', type: 'button', text: '再来一遍' });
    again.addEventListener('click', function () { startStory(state.story); });
    const home = make('button', { class: 'btn', type: 'button', text: '回标题页' });
    home.addEventListener('click', function () { state.screen = 'title'; render(); });
    const help = make('button', { class: 'btn', type: 'button', text: '求助资源' });
    help.addEventListener('click', function () { openCrisisHelp(); });
    row.appendChild(again); row.appendChild(home); row.appendChild(help);
    panel.appendChild(row);
  }

  // --------------------------------------------------------------------------
  // 总渲染
  // --------------------------------------------------------------------------
  function render() {
    if (state.screen === 'title') return renderTitle();
    if (state.screen === 'choose') return renderChoose();
    if (state.screen === 'story') return renderStoryShell();
    if (state.screen === 'end') return renderEnd();
  }

  function renderStoryShell() {
    const main = $('#main');
    const panel = $('#panel');
    main.style.display = 'none';
    main.innerHTML = '';
    panel.style.display = '';
    panel.innerHTML = '';

    // 场景
    const stage = make('div', { id: 'stage' });
    stage.appendChild(make('div', { id: 'roomWrap' }, [
      make('div', { id: 'room' }),
    ]));
    // 对话区
    const who = make('div', { id: 'who' });
    const text = make('div', { id: 'text' });
    const choices = make('div', { id: 'choices' });
    choices.style.display = 'none';
    const hint = make('div', { id: 'hint' });
    // 「咨询师对玩家说」的聊天气泡。放在选项下面：玩家刚点完一个选项，
    // 咨询师就在这儿回一句——像聊天窗口里对方发来的一条消息。
    const chat = make('div', { id: 'chat' });
    chat.style.display = 'none';
    panel.appendChild(who); panel.appendChild(text);
    panel.appendChild(choices); panel.appendChild(chat); panel.appendChild(hint);

    // stage 放在 panel 之前：DOM 顺序决定上下位置
    panel.parentNode.insertBefore(stage, panel);
  }

  X.ui.render = render;
  X.ui.renderNode = function () { renderNode(); };
  X.ui.showResult = showResult;
  X.ui.advance = advance;
  X.ui.openCrisisHelp = openCrisisHelp;
  X.ui.startStory = startStory;
  X.ui.scaleRoom = scaleRoom;

  /**
   * 清干净回到标题页。
   * 别让外部直接改 state 再调 render()——那样上一局的 overlay / 打字机 /
   * 选项状态都还留着，下一页会莫名其妙（测试里踩过）。
   */
  X.ui.restart = function () {
    if (typer) { typer.skip(); typer = null; }
    closeOverlay();
    awaitingChoice = false;
    paperOpen = false;
    resultSeen = false;
    state.screen = 'title';
    state.story = null;
    state.node = null;
    state.line = null;
    render();
  };

  // 选选项
  X.ui.chooseOption = function (index) {
    const node = state.node;
    if (!node || node.type !== 'choice' || !awaitingChoice) return;
    const opt = node.options[index];
    if (!opt) return;
    E.recordChoice(state.line, opt);
    awaitingChoice = false;
    clearChoices();
    advance(opt.next);
  };

  // --------------------------------------------------------------------------
  // 键盘
  // --------------------------------------------------------------------------
  document.addEventListener('keydown', function (ev) {
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;

    // 纸开着时，空格 / 回车 = 点那张纸的按钮
    if (overlayEl && overlayEl.classList.contains('on')) {
      if (ev.key === ' ' || ev.key === 'Enter') {
        const btn = $('.btn.primary', overlayEl) || $('.btn', overlayEl);
        if (btn) { ev.preventDefault(); btn.click(); }
      }
      return;
    }

    if (state.screen !== 'story') {
      if (ev.key === 'Escape' && state.screen !== 'title') {
        state.screen = 'title';
        render();
      }
      return;
    }

    if (awaitingChoice) {
      const n = parseInt(ev.key, 10);
      if (n >= 1 && n <= 9) {
        ev.preventDefault();
        X.ui.chooseOption(n - 1);
      }
      return;
    }

    if (ev.key === ' ' || ev.key === 'Enter') {
      ev.preventDefault();
      const t = $('#text');
      if (t && t._advance) t._advance();
    }
  });

  window.addEventListener('resize', function () {
    if (state.screen === 'story') scaleRoom();
  });

  // --------------------------------------------------------------------------
  // 启动
  // --------------------------------------------------------------------------
  X.ui.boot = function () {
    E.load();
    render();
  };
})(window.XLZX = window.XLZX || {});

/* ===== 启动 ===== */
window.XLZX.ui.boot();

</script>

</body>

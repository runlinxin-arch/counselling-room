<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>心理咨询 · 康复心理学课程作业</title>
<meta name="description" content="一个叙事驱动的康复心理学科普游戏。你扮演康复医院心理门诊的咨询师。">
<meta name="color-scheme" content="dark">
<style>
/* ==========================================================================
   《心理咨询》· 样式
   设计令牌在最上面，下面的规则全部从这里取值。改颜色只改这一段。
   ========================================================================== */

:root {
  /* ---- 色板（全部取自方案 B 已冻结的 39 色，界面和房间是同一个下午）---- */
  --wall:      #241b14;  /* 墙灰 · 页面底 */
  --wall-dark: #1b140f;  /* 深缝 · 更深一层 */
  --base:      #3a2b1f;  /* 踢脚线 · 所有分隔线 */
  --floor:     #2e2115;  /* 地板棕 · 侧栏 */
  --blue:      #5b8199;  /* 沙发蓝 · 品牌色 */
  --blue-dim:  #3f5f75;  /* 沙发暗蓝 */
  --lamp:      #ffe0a8;  /* 暖灯黄 · 唯一的高饱和暖色 */
  --paper:     #efe3c8;  /* 纸黄 · 督导笔记 */
  --paper-ink: #3a3227;  /* 纸上的字 */
  --ink:       #f4efe6;  /* 钟面米 · 正文 */
  --ink-dim:   #b6ab9c;  /* 次要文字 */
  --ink-faint: #8a7f72;  /* 最弱的一层 */

  /* 说话人 */
  --who-narrator:   #8b8880;
  --who-counselor:  #8fbcd6;
  --who-client:     #d8c39a;
  --who-doctor:     #c0a0a0;

  /* ---- 字体 ---- */
  --sans: "Noto Sans SC", "Source Han Sans SC", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "SimSun", serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
  /* 电话号码用它：等宽是为了"数字对齐"，但电话号码是给人拨的，不是给人比的。
     等宽字体一排版，号码就变成了数据；这里要的是能一眼读出来。 */
  --num: "Noto Sans SC", system-ui, "Segoe UI", sans-serif;

  /* ---- 尺度 ---- */
  --room-w: 636px;
  --room-h: 360px;
  --pad: 22px;
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: #0b0d12;
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* 整个页面就是这间房：底上一层极淡的暖光，四角再压暗 */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(120% 90% at 50% 62%, rgba(255, 217, 160, .045) 0%, rgba(255, 217, 160, 0) 55%),
    radial-gradient(140% 120% at 50% 50%, rgba(0, 0, 0, 0) 45%, rgba(0, 0, 0, .55) 100%);
  z-index: 0;
}

#screen {
  position: relative;
  z-index: 1;
  height: 100%;
  max-width: 880px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
}

/* ==========================================================================
   页头
   ========================================================================== */

#top {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 12px var(--pad) 10px;
  border-bottom: 1px solid var(--wall-dark);
}

#brand {
  display: flex;
  align-items: baseline;
  gap: 10px;
  min-width: 0;
}

#brand .zh {
  font-size: 15px;
  letter-spacing: .16em;
  color: var(--ink);
}

#brand .en {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .22em;
  color: var(--ink-faint);
  text-transform: uppercase;
}

#brand .chapter {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--blue);
  letter-spacing: .1em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#top .spacer { flex: 1 1 auto; }

/* 常驻的危机入口。这是"热线出现在 3 处"里的第 2 处——
   玩家在任何一屏、任何一步都能点到。 */
#crisisBtn {
  flex: 0 0 auto;
  font-family: inherit;
  font-size: 13px;
  color: #e8b4b4;
  background: transparent;
  border: 1px solid #6b4040;
  border-radius: 2px;
  padding: 5px 12px;
  cursor: pointer;
  letter-spacing: .06em;
  transition: background .15s, border-color .15s, color .15s;
}
#crisisBtn:hover { background: #2a1c1c; border-color: #9b5a5a; color: #ffd6d6; }

/* ==========================================================================
   场景（咨询室）
   ========================================================================== */

#stage {
  flex: 0 0 auto;
  display: flex;
  justify-content: center;
  padding: 14px var(--pad) 0;
}

#roomWrap { width: var(--room-w); max-width: 100%; }

#room {
  position: relative;
  width: 100%;
  aspect-ratio: 106 / 60;
  background: var(--wall);
  /* 细边框 + 一道内阴影，像墙上开的一扇窗 */
  box-shadow:
    0 0 0 1px var(--base),
    0 0 0 6px rgba(0, 0, 0, .22),
    0 18px 40px -18px rgba(0, 0, 0, .9);
  overflow: hidden;
  transform-origin: top center;
}

#scene { display: block; width: 100%; height: 100%; shape-rendering: crispEdges; }

/* 可点物件：平时极轻地呼吸，指上去立刻亮起来 */
.hotspot { cursor: pointer; }
.hotspot .art { animation: breathe 1.9s ease-in-out infinite; }
.hotspot:hover .art,
.hotspot:focus-visible .art {
  animation: none;
  filter: brightness(1.6) drop-shadow(0 0 4px var(--lamp));
}
@keyframes breathe { 0%, 100% { opacity: 1 } 50% { opacity: .62 } }

/* ==========================================================================
   对话区
   ========================================================================== */

#panel {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  padding: 18px var(--pad) 16px;
}

#who {
  flex: 0 0 auto;
  font-size: 13px;
  letter-spacing: .1em;
  color: var(--who-narrator);
  min-height: 1.4em;
  margin-bottom: 6px;
}
#who[data-role="咨询师"]      { color: var(--who-counselor); }
#who[data-role="林越"]        { color: var(--who-client); }
#who[data-role="王医生"]      { color: var(--who-doctor); }
#who[data-role="旁白"]        { color: var(--who-narrator); }

#text {
  flex: 1 1 auto;
  min-height: 3.8em;
  font-size: 19px;
  line-height: 1.85;
  letter-spacing: .01em;
  color: var(--ink);
}
/* 旁白和内心独白：斜一点、灰一点，和说出来的话分开 */
#text[data-role="旁白"],
#text[data-role="咨询师（内心）"] { color: #b9b5ac; font-style: italic; }

/* 光标：对话推进的提示，也是一个明确的"可点"信号 */
.caret {
  display: inline-block;
  width: .5em;
  color: var(--blue);
  animation: blink 1.1s steps(1, end) infinite;
}
@keyframes blink { 0%, 50% { opacity: 1 } 50.01%, 100% { opacity: 0 } }
.caret.off { visibility: hidden; }

/* ---- 选项 ---- */
#choices {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  gap: 7px;
  margin-top: 14px;
}

.choice {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  width: 100%;
  text-align: left;
  font-family: inherit;
  font-size: 16px;
  line-height: 1.55;
  color: var(--ink);
  background: #191b23;
  border: 1px solid var(--base);
  border-left: 2px solid var(--blue-dim);
  border-radius: 2px;
  padding: 11px 14px;
  cursor: pointer;
  transition: background .14s, border-color .14s, transform .1s;
}
.choice:hover:not(:disabled) {
  background: #20242f;
  border-left-color: var(--blue);
  transform: translateX(2px);
}
.choice:active:not(:disabled) { transform: translateX(2px) scale(.995); }
.choice:disabled { cursor: default; opacity: .5; }

.choice .key {
  flex: 0 0 auto;
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.9;
  color: var(--blue);
  min-width: 1em;
}
.choice .label { flex: 1 1 auto; }

/* ---- 底部提示 ---- */
#hint {
  flex: 0 0 auto;
  min-height: 1.5em;
  margin-top: 12px;
  font-size: 12.5px;
  color: var(--ink-faint);
  letter-spacing: .04em;
  display: flex;
  align-items: center;
  gap: 8px;
}
#hint .dot {
  width: 6px; height: 6px;
  background: var(--lamp);
  border-radius: 50%;
  box-shadow: 0 0 7px var(--lamp);
  animation: breathe 1.9s ease-in-out infinite;
}
#hint .right { margin-left: auto; font-family: var(--mono); font-size: 11px; }

/* ==========================================================================
   纸（督导笔记 / 科普卡 / 转介单 / 资源卡 / 成绩单）
   这是整个界面唯一的高亮物 —— 别的都得安静。
   ========================================================================== */

#overlay {
  position: fixed;
  inset: 0;
  z-index: 40;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 28px 20px;
  background: rgba(6, 7, 10, .84);
  backdrop-filter: blur(2px);
}
#overlay.on { display: flex; }

.paper {
  position: relative;
  width: min(560px, 100%);
  max-height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--paper);
  color: var(--paper-ink);
  font-family: var(--serif);
  border-radius: 1px;
  box-shadow: 0 24px 60px -20px rgba(0, 0, 0, .95), 0 0 0 1px rgba(0, 0, 0, .4);
  /* 纸角一点点不齐，像真的被裁过 */
  clip-path: polygon(0 .6%, 99.4% 0, 100% 99.2%, .7% 100%);
  animation: paperIn .34s cubic-bezier(.16, .84, .3, 1);
}
@keyframes paperIn {
  from { opacity: 0; transform: translateY(10px) rotate(-.5deg) scale(.985); }
  to   { opacity: 1; transform: none; }
}
#overlay.slide .paper { animation: noteIn .4s cubic-bezier(.16, .84, .3, 1); }
@keyframes noteIn {
  from { opacity: 0; transform: translateX(34px) rotate(1.1deg); }
  to   { opacity: 1; transform: none; }
}

.paper .head {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 16px 24px 10px;
}
.paper .head .label {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .24em;
  text-transform: uppercase;
  color: #8a7c62;
}
.paper[data-kind="referral"]  .head .label { color: #8a5a5a; }
.paper[data-kind="resource"]  .head .label { color: #7a6a3a; }
.paper[data-kind="science"]   .head .label { color: #4f6b7a; }
.paper .head .rule { flex: 1 1 auto; height: 1px; background: rgba(58, 50, 39, .22); }

.paper h2 {
  flex: 0 0 auto;
  margin: 0;
  padding: 0 24px;
  font-size: 20px;
  font-weight: 600;
  line-height: 1.5;
  letter-spacing: .02em;
  color: #2e281f;
}

.paper .body {
  flex: 1 1 auto;
  overflow-y: auto;
  padding: 12px 24px 6px;
  font-size: 16.5px;
  line-height: 1.95;
}
.paper .body p { margin: 0 0 12px; }
.paper .body p:last-child { margin-bottom: 0; }

.paper .foot {
  flex: 0 0 auto;
  padding: 6px 24px 0;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .04em;
  color: #8a7c62;
}
.paper .foot:empty { display: none; }

.paper .actions {
  flex: 0 0 auto;
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  padding: 16px 24px 20px;
}

/* 纸上的按钮：不是界面按钮，是"在纸上盖个章"的感觉 */
.btn {
  font-family: var(--sans);
  font-size: 14px;
  letter-spacing: .08em;
  color: var(--paper-ink);
  background: transparent;
  border: 1px solid rgba(58, 50, 39, .45);
  border-radius: 1px;
  padding: 8px 20px;
  cursor: pointer;
  transition: background .14s, color .14s;
}
.btn:hover { background: rgba(58, 50, 39, .1); }
.btn.primary { background: var(--paper-ink); color: var(--paper); border-color: var(--paper-ink); }
.btn.primary:hover { background: #241f18; }

/* 转介单：右上角一个回形针的暗示，不用图，用一道斜杠 */
.paper[data-kind="referral"]::after {
  content: "";
  position: absolute;
  top: 0; right: 34px;
  width: 12px; height: 46px;
  border: 2px solid rgba(58, 50, 39, .3);
  border-bottom: none;
  border-radius: 6px 6px 0 0;
}

/* 资源卡：加一条红色标记条，和科普卡区分开 */
.paper[data-kind="resource"] { border-top: 3px solid #a4463f; }
.paper[data-kind="resource"] .body { font-size: 17px; }

/* 成绩单 */
.paper[data-kind="result"] .body { font-family: var(--sans); font-size: 15px; line-height: 1.9; }
/* lead 是"结论"，用衬线；下面的清单是"账目"，用无衬线 */
.paper .result-lead {
  margin: 0;
  padding: 10px 24px 0;
  font-family: var(--serif);
  font-size: 16px;
  line-height: 1.95;
  color: #3a3227;
}
.tally { list-style: none; margin: 0 0 16px; padding: 0; }
.tally li {
  display: flex;
  gap: 10px;
  padding: 7px 0;
  border-bottom: 1px dashed rgba(58, 50, 39, .22);
}
.tally li:last-child { border-bottom: none; }
.tally .k { flex: 0 0 6.5em; color: #6d6250; }
.tally .v { flex: 1 1 auto; color: #2e281f; }
.tally .v.miss { color: #8a5a20; }

/* ---- 逐字写出 ---- */
.writing { white-space: pre-wrap; }
.writing .w { opacity: 0; }
.writing .w.on { opacity: 1; }

/* ==========================================================================
   情绪日记（手机备忘录 —— 和"纸"刻意不是一套材质）
   ========================================================================== */

.diary {
  width: min(430px, 100%);
  max-height: 100%;
  display: flex;
  flex-direction: column;
  background: #16181f;
  border: 1px solid var(--base);
  border-radius: 10px;
  box-shadow: 0 24px 60px -20px rgba(0, 0, 0, .95);
  overflow: hidden;
  animation: paperIn .3s cubic-bezier(.16, .84, .3, 1);
}
.diary .bar {
  flex: 0 0 auto;
  padding: 12px 18px 10px;
  border-bottom: 1px solid #23252e;
  font-size: 13px;
  color: var(--ink-dim);
  letter-spacing: .04em;
}
.diary .bar b { color: var(--ink); font-weight: 400; }
.diary .list { flex: 1 1 auto; overflow-y: auto; padding: 8px 10px 12px; }

.entry {
  width: 100%;
  text-align: left;
  font-family: inherit;
  background: transparent;
  border: none;
  border-radius: 6px;
  padding: 11px 12px;
  cursor: pointer;
  display: flex;
  gap: 12px;
  align-items: baseline;
  transition: background .14s;
}
.entry:hover { background: #1e212b; }
.entry.open { background: #1e212b; }
.entry .day {
  flex: 0 0 3.2em;
  font-size: 13px;
  color: var(--blue);
  letter-spacing: .06em;
}
.entry .peek {
  flex: 1 1 auto;
  font-size: 14px;
  color: var(--ink-faint);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.entry.open .peek { display: none; }
.entry .full { display: none; flex: 1 1 auto; font-size: 15px; line-height: 1.9; color: var(--ink); }
.entry.open .full { display: block; }
.entry .full .line { display: block; }
.entry .full .line.strong { color: var(--lamp); }
.entry .full .note {
  display: block;
  margin-top: 8px;
  font-size: 12.5px;
  color: var(--ink-faint);
}

.diary .foot {
  flex: 0 0 auto;
  padding: 10px 18px 14px;
  border-top: 1px solid #23252e;
  font-size: 12.5px;
  color: var(--ink-faint);
  text-align: center;
}
.diary .foot.ready { color: var(--blue); }

/* ==========================================================================
   标题页 / 选线页
   ========================================================================== */

.page {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  padding: 30px var(--pad);
}

/* ---- 标题页 ---- */
.title-grid {
  display: grid;
  grid-template-columns: 1.15fr .85fr;
  gap: 30px;
  align-items: start;
  min-height: 100%;
}

.title-main { display: flex; flex-direction: column; justify-content: center; padding-top: 8px; }

.title-main .kicker {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .3em;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 22px;
}
.title-main h1 {
  margin: 0 0 6px;
  font-size: 46px;
  line-height: 1.15;
  letter-spacing: .1em;
  font-weight: 400;
  color: var(--ink);
}
.title-main .sub {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .34em;
  color: var(--ink-faint);
  text-transform: uppercase;
  margin-bottom: 26px;
}
.title-main .pitch {
  font-size: 16px;
  line-height: 2;
  color: var(--ink-dim);
  max-width: 34em;
  margin: 0 0 30px;
}
.title-main .pitch em { font-style: normal; color: var(--ink); }

.start {
  align-self: flex-start;
  display: inline-flex;
  align-items: center;
  gap: 12px;
  font-family: inherit;
  font-size: 17px;
  letter-spacing: .14em;
  color: #0b0d12;
  background: var(--blue);
  border: none;
  border-radius: 2px;
  padding: 14px 34px;
  cursor: pointer;
  transition: background .16s, transform .1s;
}
.start:hover { background: #7aa5bd; }
.start:active { transform: translateY(1px); }
.start .arrow { font-family: var(--mono); font-size: 13px; }

.resume {
  align-self: flex-start;
  margin-top: 12px;
  font-family: inherit;
  font-size: 13px;
  color: var(--ink-faint);
  background: none;
  border: none;
  border-bottom: 1px dashed var(--base);
  padding: 2px 0;
  cursor: pointer;
  letter-spacing: .04em;
}
.resume:hover { color: var(--blue); border-color: var(--blue); }

/* ---- 右侧：声明与资源 ---- */
.title-side {
  border-left: 1px solid var(--wall-dark);
  padding: 4px 0 4px 26px;
  font-size: 13.5px;
  line-height: 1.85;
  color: var(--ink-dim);
}
.title-side h3 {
  margin: 0 0 10px;
  font-size: 12px;
  font-weight: 400;
  letter-spacing: .2em;
  color: var(--ink-faint);
  font-family: var(--mono);
  text-transform: uppercase;
}
.title-side p { margin: 0 0 12px; }
.title-side .disc { color: var(--ink); }
.title-side hr { border: none; border-top: 1px solid var(--wall-dark); margin: 18px 0; }

.hotline {
  margin-top: 4px;
  padding: 13px 16px;
  background: #1a1c24;
  border-left: 2px solid #a4463f;
  border-radius: 1px;
}
.hotline .n {
  font-family: var(--num);
  font-size: 21px;
  font-weight: 500;
  letter-spacing: .04em;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
  display: block;
  margin: 2px 0 8px;
}
.hotline .n:last-child { margin-bottom: 0; }
.hotline .n small {
  display: block;
  font-family: var(--sans);
  font-size: 12px;
  letter-spacing: .04em;
  color: var(--ink-faint);
  margin-top: 2px;
}

/* ---- 选线页 ---- */
.choose-head { margin-bottom: 24px; }
.choose-head .kicker {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .28em;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 12px;
}
.choose-head h2 {
  margin: 0 0 8px;
  font-size: 26px;
  font-weight: 400;
  letter-spacing: .06em;
}
.choose-head p { margin: 0; color: var(--ink-dim); font-size: 14.5px; max-width: 44em; }

.lines { display: flex; flex-direction: column; gap: 12px; }

.line-card {
  position: relative;
  display: flex;
  gap: 20px;
  align-items: center;
  width: 100%;
  text-align: left;
  font-family: inherit;
  background: #191b23;
  border: 1px solid var(--base);
  border-radius: 2px;
  padding: 18px 20px;
  cursor: pointer;
  transition: background .16s, border-color .16s, transform .1s;
}
.line-card[data-ready="true"]:hover {
  background: #1f2330;
  border-color: var(--blue-dim);
  transform: translateX(3px);
}
.line-card[data-ready="false"] { cursor: not-allowed; opacity: .42; }
.line-card[data-ready="false"]:hover { opacity: .52; }

.line-card .num {
  flex: 0 0 auto;
  font-family: var(--mono);
  font-size: 30px;
  line-height: 1;
  color: var(--blue-dim);
  width: 1.5em;
  text-align: center;
}
.line-card[data-ready="true"] .num { color: var(--blue); }

.line-card .meta { flex: 1 1 auto; min-width: 0; }
.line-card .meta h3 {
  margin: 0 0 5px;
  font-size: 18px;
  font-weight: 400;
  letter-spacing: .06em;
  color: var(--ink);
}
.line-card .meta .who {
  font-size: 12.5px;
  color: var(--ink-faint);
  letter-spacing: .03em;
  margin-bottom: 7px;
  font-family: var(--mono);
}
.line-card .meta .what { font-size: 14.5px; color: var(--ink-dim); }

.line-card .badge {
  flex: 0 0 auto;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: .18em;
  padding: 4px 10px;
  border: 1px solid var(--base);
  border-radius: 1px;
  color: var(--ink-faint);
  text-transform: uppercase;
}
.line-card[data-ready="true"] .badge { color: var(--blue); border-color: var(--blue-dim); }
.line-card[data-done="true"] .badge { color: var(--lamp); border-color: #7a6a3a; }

/* 剪影：没写的两条线，用一条人的形状占位，不假装能玩 */
.silhouette {
  position: absolute;
  right: 22px;
  bottom: 14px;
  width: 40px;
  height: 40px;
  opacity: .5;
  pointer-events: none;
}

/* ==========================================================================
   转场
   ========================================================================== */

#fade {
  position: fixed;
  inset: 0;
  z-index: 30;
  background: #06070a;
  opacity: 0;
  pointer-events: none;
  transition: opacity .5s ease;
}
#fade.on { opacity: 1; }

/* ==========================================================================
   焦点 / 键盘 / 小屏 / 减弱动效
   ========================================================================== */

:focus-visible {
  outline: 2px solid var(--lamp);
  outline-offset: 3px;
}

/* 窄屏：右栏挪到主栏下面，房间满宽 */
@media (max-width: 820px) {
  .title-grid { grid-template-columns: 1fr; gap: 26px; }
  .title-side { border-left: none; border-top: 1px solid var(--wall-dark); padding: 22px 0 0; }
  .title-main h1 { font-size: 34px; }
  #text { font-size: 17px; }
}

@media (max-height: 620px) {
  #text { font-size: 17px; min-height: 3em; }
  #panel { padding-top: 12px; }
  .title-main h1 { font-size: 34px; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
  .hotspot .art { opacity: 1; }
  .paper, .diary { animation: none; }
}

/* 打印/无脚本时的兜底，别让页面白屏 */
.noscript {
  padding: 40px var(--pad);
  color: var(--ink-dim);
  font-size: 15px;
  line-height: 2;
}
</style>

<script>
/* ===== src/sprites.js ===== */
// 立绘 + 场景时段变体。
// 方案 B 冻结的是「空房间」，没有画人；这里补上两个人和几处随剧情变的东西。
//
// 坐标系统一：和方案 B 一样，每个字符 = 1 个逻辑像素，空格 = 透明，106 × 60 的画布。
// 渲染时不做缩放，所以人必须画在房间尺度的像素上——头大概 5–6 像素宽，跟沙发一个量级。

// 方案 B 的 39 色里没有肤色、发色、衣服色（原本只画家具）。补 6 个，语气保持一致：低饱和。
const PAL_EXT = {
  H: '#2a2622', // 头发（黑）
  Z: '#bd8e6b', // 皮肤
  z: '#9c7154', // 皮肤（暗面）
  E: '#4f6478', // 来访者卫衣（灰蓝，压得比沙发暗一点，不抢）
  e: '#3d4f60', // 来访者卫衣（暗面）
  K: '#5f707f', // 咨询师针织衫（比沙发浅，坐左边那把沙发时能分开）
  L: '#c0c6cc', // 咨询师内搭 T 恤（浅灰）
};

// 轮椅（14 × 17）：大轮 + 小前轮 + 脚踏 + 推手。
// 关键：**大轮要有浅色轮辋（s）**。全用深色框（D）的话，轮子会糊进沙发和地板的暗部，
// 整把椅子就只剩一个悬空的小前轮，看起来像画错了。
// 轮辐之间留空，让墙和地板透过轮子——读起来才是个"轮"。
const WHEELCHAIR = [
  '  sSS         ',
  ' SsssS        ',
  'Ss   Ss   S   ',
  'Ss D sS  SS   ',
  'Ss D sS SSS   ',
  'Ss D sS SS    ',
  'Ss D sS S     ',
  'Ss D sS       ',
  'Ss   sS       ',
  ' SsssS        ',
  '  sssssssss   ',
  '  SS          ',
  '   SS         ',
  '   S          ',
  '   S          ',
  '   SS         ',
  '  uuu         ',
];
// 林越：坐姿，深色头发、灰蓝卫衣、手搭在扶手上，腿朝右搁在脚踏上
const LINYUE = [
  '    HHHH      ',
  '   HHHHHH     ',
  '   HZZZZH     ',
  '   ZZZZZZ     ',
  '    ZZZZ      ',
  '    EEEE      ',
  '   EEEEEE     ',
  ' Z EEEEEE Z   ',
  ' Z EEEEEE Z   ',
  ' z eeeeee z   ',
  '   EEEEEE     ',
  '   EEEEEE     ',
  '   DDDDDD     ',
  '   DDDDDDDDD  ',
  '   DDDD  DDDD ',
  '   DDD    DDD ',
  '  DDDD    DDD ',
];

// 咨询师（玩家）：坐在左边沙发上，面朝右，手里的笔和本子是玩家自己的视角，
// 所以不画——画了会变成"看着自己"，很怪。
const COUNSELOR = [
  '   HHHHH      ',
  '  HHHHHHH     ',
  '  HHZZZZH     ',
  '   ZZZZZ      ',
  '   ZZZZ       ',
  '   KKKK       ',
  '  KKKKKK      ',
  ' ZKKKKKK Z    ',
  ' ZKLLLLKK Z   ',
  ' zKKKKKK z    ',
  '  KKKKKK      ',
  '  KKKKKK      ',
  '  DDDDDD      ',
  '  DDDDDDDD    ',
  '  DDDD DDDD   ',
  ' DDDD   DDD   ',
];

// 人的画法分两种，别搞混：
//   · 坐沙发的人（咨询师）——**后画**，腿被坐垫吃掉才是"坐着"
//   · 坐轮椅的人（林越）——**先画椅子、后画人**，椅子的框架要从人的腿前面穿过去
//     （真实坐姿就是这样：人坐在架子中间，大轮和脚踏在人和地面之间）
//
// 沙发坐垫在第 13–18 行（沙发摆 y=26 → 画布 y=39–44）。
// 头 y≈30–34，髋部 y≈41，腿 y≈42–45。
const CHARS = {
  // 林越：靠门那把沙发（sofaR 在 x=56，坐垫 x=63–72）。
  // 髋部要对上轮椅第 10 行的坐面（椅摆 y=33 → 画布 y=43），所以人摆在 y=31。
  client: { chair: WHEELCHAIR, chairX: 63, chairY: 33, body: LINYUE, bodyX: 63, bodyY: 31 },
  // 咨询师：左边那把（sofaL 在 x=20，坐垫 x=27–36），朝向画面右
  counselor: { body: COUNSELOR, bodyX: 26, bodyY: 29 },

    state.flags = snap.flags || {};

    state.node = node;

  function applyEffects(node) {

      if (!eff) return;
      if (eff === 'crisis') state.flags.crisisTriggered = true;
      else if (eff === 'markScreenMissed') state.flags.screenMissed = true;
      else if (eff === 'unlockDiary') state.flags.diaryUnlocked = true;

  /** 进到某个节点时的统一处理：切时段、记卡片、落盘 */
  function enter(node) {
    if (!node) return;

    if (typeof node.warmth === 'number') state.warmth = node.warmth;
    applyEffects(node);
    // 副作用是"存档状态"的一部分，进节点就落盘。

    //
    // 这里直接写 save.current，**不要调 saveCurrent()**：那个函数挂在下面的
    // X.engine 对象字面量上，这时候还没赋值（函数声明会提升，函数表达式不会）。

    const key = kind + ':' + String(text || '').slice(0, 18);
    if (state.cardsSeen.indexOf(key) < 0) state.cardsSeen.push(key);
  }

    state.choices.push({ node: nodeId, key: option.key, label: option.label });
    if (option.flag) state.flags[option.flag] = true;
  }

    if (state.itemsSeen.indexOf(itemId) < 0) state.itemsSeen.push(itemId);
  }

  function recordDiary(entryId) {

  /**
   * 背景：墙 / 护墙板 / 踢脚线 / 木地板。
   *
   * 这一层是「房间」而不是「家具」的骨架，所以它决定整幅画的**明度层次**：
   *   亮墙（. ,）→ 中间调护墙板（-）→ 过渡踢脚线（=）→ 中深地板（# ｜ +）
   * 早先地板和家具落在同一档明度上（都是近黑褐），两者糊成一片，
   * 所以看起来像把家具"贴"在墙纸上，而不是站在房间里。
   *
   * 另一处刻意的选择：**靠窗一侧更亮**。同一面墙从左到右有一个很轻的
   * 渐变，地板也一样——这是让"光从窗户进来"这件事在背景层就成立，
   * 而不是只靠最后一层半透明暖色硬叠。
   */
  const FLOOR_TOP = 34;        // 踢脚线所在行
  const WAINSCOT = 26;         // 护墙板分界：往上亮墙、往下略深

  /** 便宜的确定性哈希（0..n-1）。用来做不规则木纹，别用随机——同一帧要可复现。 */
  function hash2(x, y) {

    n = (n ^ (n >> 13)) * 1274126177 | 0;
    return Math.abs(n ^ (n >> 16));
  }

      // 靠窗（左侧）一带略亮，向右极轻微压暗：让"光从窗户进来"在背景层就成立

      // 细竖纹壁纸：每 5 px 一道。太密的话 6 倍放大后会跳。
      if (x % 5 === 0) return ',';
      return shade ? ',' : '.';
    }
    if (y === FLOOR_TOP) return '=';   // 踢脚线

    // ---- 木地板 ----
    // 走过的两次弯路，记下来免得再犯：
    //   1. 每 4 行横缝 + 每 13 列竖缝 → 读成瓷砖
    //   2. 纯哈希散点 → 读成地面脏了
    // 木头真正可读的特征是**方向性**：纹路顺着板长走。所以这里用"横向短纹"
    // 加"稀疏板端竖缝"，两者错开，才有木地板的读感。
    const h = hash2(x, y);
    const course = y - FLOOR_TOP;

    // 板端：稀疏的短竖缝（相邻层错开，且不通长）
    const seamShift = (course & 1) ? 6 : 0;
    if ((x + seamShift) % 19 === 0) return '|';

    // 木纹：顺着板长方向的短横道。
    // 关键是不能用"当前像素的哈希"决定自己画不画——那只会画出单点。
    // 改为：每 6 px 放一个**锚点**，由锚点的哈希决定这一道的起点与长度。
    const anchor = x - (((x % 11) + 11) % 11);
    const ah = hash2(anchor, y);
    if (ah % 9 === 0) {
      const start = anchor + (ah % 3);
      const len = 2 + (ah % 4);          // 2–5 px
      if (x >= start && x < start + len) return '+';
    }

    // 极稀疏的木节，打破均匀（只要几个）

    return el('rect', a);
  }

  function paint(map, ox, oy, parent) {
    if (!map) return;
    map.forEach(function (line, dy) {

      while (x < line.length) {
        const ch = line.charAt(x);
        if (ch === ' ' || !PAL[ch]) { x++; continue; }
        let w = 1;
        while (line.charAt(x + w) === ch) w++;

      y: y,

  }

    '.hs .art{animation:b 1.9s ease-in-out infinite}' +

    const clickable = opts.clickable || [];
    const withPeople = opts.withPeople !== false;

    const bg = el('g', {});

    S.shadows.forEach(function (box) {

    });

    //     人物排在沙发之后、茶几之前：这样手能搭在沙发扶手上，
    //     而茶几和上面那盒纸巾、那张转介单会挡住两人的下缘。
    const scene = S.scene;
    scene.forEach(function (row) {
      if (row[0] === 'clock') return;                        // 钟按小节换指针，最后单独画
      if (row[0] === 'table') return;                        // 茶几要压在人上面
      if (row[0] === 'cup' && withPeople) return;            // 有人时杯子被挡着
      paint(S.sprites[row[0]], row[1], row[2], svg);
    });

    if (withPeople) {
      const c = X.CHARS.client;
      paint(X.WHEELCHAIR, c.chairX, c.chairY, svg);
      paint(c.body, c.bodyX, c.bodyY, svg);
      const k = X.CHARS.counselor;
      paint(k.body, k.bodyX, k.bodyY, svg);
    }

    // 茶几（压在人腿上）
    const tableRow = scene.find(function (r) { return r[0] === 'table'; });
    if (tableRow) paint(S.sprites.table, tableRow[1], tableRow[2], svg);

    // 茶几上的转介单和纸巾盒。都是小方块，按现实比例画的（见 src/sprites.js 的注释）。
    paint(X.REFERRAL, 43, 34, svg);
    paint(X.TISSUE, 49, 35, svg);

    // --- 4) 墙上的钟（按小节换指针）---
    const clockRow = scene.find(function (r) { return r[0] === 'clock'; });
    if (clockRow) {
      const clk = X.CLOCK_VARIANTS['c' + act] || S.sprites.clock;
      paint(clk, clockRow[1], clockRow[2], svg);
    }

    // --- 5) 暖光与四角压暗（整体叠一层）---
    const w = X.WARMTH[warmth] || X.WARMTH[1];
    svg.appendChild(el('rect', { x: 0, y: 0, width: GW, height: GH, fill: '#ffd9a0', opacity: w.glow }));
    svg.appendChild(el('rect', { x: 0, y: 0, width: GW, height: GH, fill: '#06070a', opacity: w.vignette * 0.38 }));

    // --- 6) 可点物件的热区。放最上层，保证不被人物挡住。---
    HOTSPOTS.forEach(function (hs) {
      if (clickable.indexOf(hs.id) < 0) return;
      if (hs.id === 'wheelchair' && !withPeople) return;

      let sprite;
      if (hs.id === 'wheelchair') sprite = X.WHEELCHAIR;
      else if (hs.id === 'referral') sprite = X.REFERRAL;
      else if (hs.id === 'tissue') sprite = X.TISSUE || S.sprites.tissue;
      else if (hs.id === 'clock') sprite = X.CLOCK_VARIANTS['c' + act] || S.sprites.clock;
      else sprite = S.sprites[hs.sprite];
      if (!sprite) return;

      const b = boundsOf(sprite, hs.x, hs.y);
      const g = el('g', { class: 'hs', tabindex: '0', role: 'button' });
      const art = el('g', { class: 'art' });
      paint(sprite, hs.x, hs.y, art);
      g.appendChild(art);
      const t = el('title', {});
      t.textContent = hs.label;
      g.appendChild(t);
      // 热区比图形大一圈，鼠标好点中；而且它必须是透明的实心块，
      // 否则 caster 和地板的缝里点不到。
      g.appendChild(el('rect', {
        x: b.x - 1.5, y: b.y - 1.5, width: b.w + 3, height: b.h + 3, fill: 'transparent',
      }));
      g.addEventListener('click', function () { opts.onItem && opts.onItem(hs.id); });
      g.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter' || ev.key === ' ' || ev.key === 'Spacebar') {
          ev.preventDefault();
          opts.onItem && opts.onItem(hs.id);
        }
      });
      svg.appendChild(g);
    });

    return svg;
  }

  // --------------------------------------------------------------------------
  // 对外
  // --------------------------------------------------------------------------
  X.engine = {
    SAVE_KEY: SAVE_KEY,
    HOTSPOTS: HOTSPOTS,
    state: state,
    save: function () { return save; },
    load: load,
    persist: persist,
    emptySave: emptySave,
    getNode: getNode,
    resolve: resolve,
    sectionMeta: sectionMeta,
    snapshot: snapshot,
    restore: restore,
    go: go,
    enter: enter,
    recordCard: recordCard,
    recordChoice: recordChoice,
    recordItem: recordItem,
    recordDiary: recordDiary,
    renderScene: renderScene,
    markDone: function (storyId) {
      save.done[storyId] = true;
      state.screenMode = 'title';
      persist();
    },
    clearCurrent: function () {
      save.current = null;
      persist();
    },
    saveCurrent: function () {
      save.current = snapshot();
      persist();
    },
  };
})(window.XLZX = window.XLZX || {});

// ============================================================================
// 界面：标题页 / 选线页 / 对话 / 纸 / 情绪日记 / 逐字写出

// ============================================================================

(function (X) {

  const $$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };

  function make(tag, attrs, kids) {
    const el = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      if (k === 'class') el.className = attrs[k];
      else if (k === 'text') el.textContent = attrs[k];
      else if (k === 'html') el.innerHTML = attrs[k];
      else if (attrs[k] !== null && attrs[k] !== undefined) el.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) { if (c) el.appendChild(c); });
    return el;
  }

  // --------------------------------------------------------------------------
  // 逐字写出
  // --------------------------------------------------------------------------
  const reduceMotion = window.matchMedia
    ? window.matchMedia('(prefers-reduced-motion: reduce)').matches
    : false;

  /**
   * 把文字一段一段写出来。返回一个 { done(), skip() } 句柄。
   * 用 Array.from 而不是 charAt——中文和标点各占一个码点，substring 会切坏。
   */
  function typewrite(container, text, opts) {
    opts = opts || {};
    const speed = opts.speed || 26;      // 每个字的毫秒数
    const container$ = container;
    container$.textContent = '';

    const chars = Array.from(text);
    const spans = chars.map(function (ch) {
      const s = document.createElement('span');
      s.className = 'w';
      s.textContent = ch;
      container$.appendChild(s);
      return s;
    });

    if (reduceMotion) {
      spans.forEach(function (s) { s.classList.add('on'); });
      return { done: function () { return true; }, skip: function () {} };
    }

    let i = 0;
    let finished = false;
    let timer = null;

    function step() {
      if (i >= spans.length) {
        finished = true;
        if (opts.onEnd) opts.onEnd();
        return;
      }
      const ch = chars[i];
      spans[i].classList.add('on');
      i++;
      // 标点处多停一下——不是匀速打字，是"写"的节奏
      let wait = speed;
      if ('。！？'.indexOf(ch) >= 0) wait = speed * 7;
      else if ('，、；：'.indexOf(ch) >= 0) wait = speed * 3.5;
      else if (ch === '\n') wait = speed * 4;
      timer = window.setTimeout(step, wait);
    }

    timer = window.setTimeout(step, speed);

    return {
      done: function () { return finished; },
      skip: function () {
        if (timer) window.clearTimeout(timer);
        spans.forEach(function (s) { s.classList.add('on'); });
        i = spans.length;
        finished = true;
        if (opts.onEnd) opts.onEnd();
      },
    };
  }

  // --------------------------------------------------------------------------
  // 纸（督导笔记 / 科普卡 / 转介单 / 资源卡 / 成绩单）
  // --------------------------------------------------------------------------
  let overlayEl = null;

  function closeOverlay() {
    if (!overlayEl) return;
    overlayEl.classList.remove('on', 'slide');
    overlayEl.innerHTML = '';
  }

  /**
   * 弹一张纸。
   * @param {object} o { kind, title, lines[], footer, button, onClose, write }
   */
  function showPaper(o) {
    if (!overlayEl) {
      overlayEl = make('div', { id: 'overlay' });
      document.body.appendChild(overlayEl);
    }
    // 玩家真正看到过的资料才算数——成绩单里的"看过的资料"就是靠这一步记的。
    // （不能在节点上记：card 节点里根本没有 note 字段。）
    if (o.kind && o.kind !== 'result' && o.kind !== 'resource') {
      E.recordCard(o.kind, o.title);
    }
    overlayEl.className = 'on' + (o.slide ? ' slide' : '');
    overlayEl.innerHTML = '';

    const LABELS = {
      supervision: '督导笔记',
      science: '科普',
      referral: '转介单',
      resource: '求助资源',
      result: '成绩',
    };

    const paper = make('div', { class: 'paper', 'data-kind': o.kind || 'science' });
    paper.appendChild(make('div', { class: 'head' }, [
      make('span', { class: 'label', text: LABELS[o.kind] || '资料' }),
      make('span', { class: 'rule' }),
    ]));
    if (o.title) paper.appendChild(make('h2', { text: o.title }));

    const body = make('div', { class: 'body' });
    paper.appendChild(body);

    const foot = make('div', { class: 'foot', text: o.footer || '' });
    if (o.footer) paper.appendChild(foot);

    const actions = make('div', { class: 'actions' });
    const btn = make('button', {
      class: 'btn' + (o.kind === 'resource' ? ' primary' : ''),
      type: 'button',
      text: o.button || '知道了',
    });
    actions.appendChild(btn);
    paper.appendChild(actions);
    overlayEl.appendChild(paper);

    // 正文：督导笔记和转介单逐字写出来，科普卡直接给（它更长，等不起）
    const full = (o.lines || []).join('\n\n');
    let handle = null;
    if (o.write && !reduceMotion) {
      const wrap = make('div', { class: 'writing' });
      body.appendChild(wrap);
      handle = typewrite(wrap, full, { speed: o.speed || 22 });
    } else {
      (o.lines || []).forEach(function (line) {
        body.appendChild(make('p', { text: line }));
      });
    }

    function finish() {
      closeOverlay();
      if (o.onClose) o.onClose();
    }

    btn.addEventListener('click', function () {
      // 还没写完就点：先把字补完，再点一次才关
      if (handle && !handle.done()) { handle.skip(); return; }
      finish();
    });
    btn.focus({ preventScroll: true });

    // 点纸外面也能关（但只有写完之后才允许，免得误触跳过）
    overlayEl.addEventListener('mousedown', function (ev) {
      if (ev.target !== overlayEl) return;
      if (handle && !handle.done()) return;
      finish();
    });

    return { close: finish };
  }

  X.ui = { showPaper: showPaper, closeOverlay: closeOverlay, typewrite: typewrite, reduceMotion: reduceMotion };

  // --------------------------------------------------------------------------
  // 情绪日记（手机备忘录的样子 —— 和"纸"不是一套材质）
  // --------------------------------------------------------------------------
  function showDiary(node, onDone) {
    if (!overlayEl) {
      overlayEl = make('div', { id: 'overlay' });
      document.body.appendChild(overlayEl);
    }
    overlayEl.className = 'on';
    overlayEl.innerHTML = '';

    const wrap = make('div', { class: 'diary' });
    wrap.appendChild(make('div', { class: 'bar' }, [
      make('b', { text: '备忘录' }),
      document.createTextNode('　' + (node.title || '情绪日记')),
    ]));

    const list = make('div', { class: 'list' });
    const foot = make('div', { class: 'foot' });

    const total = node.entries.length;
    let opened = 0;

    node.entries.forEach(function (entry) {
      const btn = make('button', { class: 'entry', type: 'button' });
      btn.appendChild(make('span', { class: 'day', text: entry.day }));
      btn.appendChild(make('span', { class: 'peek', text: entry.lines[0] }));

      const full = make('span', { class: 'full' });
      entry.lines.forEach(function (ln) {
        // 最后一行是那句话本身，最要紧，提亮
        const strong = ln === entry.lines[entry.lines.length - 1] && entry.lines.length > 1;
        full.appendChild(make('span', { class: 'line' + (strong ? ' strong' : ''), text: ln }));
      });
      if (entry.note) full.appendChild(make('span', { class: 'note', text: entry.note }));
      btn.appendChild(full);

      btn.addEventListener('click', function () {
        const wasOpen = btn.classList.contains('open');
        btn.classList.toggle('open');
        if (!wasOpen) {
          E.recordDiary(entry.id);
          opened = node.entries.filter(function (e2) {
            return E.state.diaryRead.indexOf(e2.id) >= 0;
          }).length;
          refreshFoot();
        }
      });
      list.appendChild(btn);
    });

    function refreshFoot() {
      // 提示只在还值得看的时候出现。都看过了就别再念叨。
      if (opened >= total) {
        tip.textContent = '四条都看完了。挑一条跟他谈。';
        tip.style.color = '#6f6c66';
      } else if (opened === 0) {
        tip.textContent = node.hint || '点开看看他都记了什么。';
        tip.style.color = '';
      } else {
        tip.textContent = '还有 ' + (total - opened) + ' 条没看。最少挑一条跟他谈。';
        tip.style.color = '';
      }
      cta.disabled = opened === 0;
      cta.textContent = opened === 0 ? '先点开一条' : '先谈哪一条';
    }

    wrap.appendChild(list);

    const actions = make('div', { class: 'foot' });
    actions.style.textAlign = 'right';
    var cta = make('button', { class: 'btn primary', type: 'button', text: '先点开一条' });
    cta.addEventListener('click', function () {
      closeOverlay();
      onDone();
    });
    actions.appendChild(cta);

    // 提示：不看完也能继续，但得先看一条
    var tip = make('div', { class: 'foot', text: '' });
    wrap.appendChild(tip);
    wrap.appendChild(actions);
    refreshFoot();

    overlayEl.appendChild(wrap);
    cta.focus({ preventScroll: true });
  }

  function currentClickable() {
    const node = state.node || {};

    if (!allowed.length || !X.roomItems) return [];

    const act = state.act;
    // 既有内容、又被这一段允许的，才是热的
    return allowed.filter(function (id) {
      if (id === 'wheelchair') return true;
      const item = X.roomItems[id];
      return item && item.acts && item.acts[act];
    });

      act: state.act,

      withPeople: true,

  /** 房间按视口缩放（保持整数倍，否则像素会糊） */
  function scaleRoom() {
    const room = $('#room');
    const wrap = $('#roomWrap');
    if (!room || !wrap) return;
    const cssW = wrap.clientWidth || 636;
    const avail = window.innerHeight;
    // 636×360 是原始尺寸，底下还要给对话区留 300px
    const maxH = Math.max(220, avail - 320);
    let factor = Math.min(1, maxH / 360);
    factor = Math.max(0.5, factor);
    if (factor >= 0.999) {
      room.style.transform = '';
      wrap.style.height = '';
    } else {
      room.style.transform = 'scale(' + factor.toFixed(3) + ')';
      wrap.style.height = Math.round(360 * factor) + 'px';
    }
  }

  /** 画当前节点 */
  function renderSay(node) {
    if (state.screen !== 'story') return;
    renderTop(chapterLabel());
    renderRoom();

    const textEl = $('#text');
    clearChoices();

    paperOpen = false;
    const role = node.who || '旁白';
    setWho(role === '旁白' ? '' : role, role);

    // 督导笔记是挂在台词上的一张纸：先把话说出来，再弹纸
    const hasNote = !!node.note;

    if (typer) typer.skip();

    if (!node.text) {
      textEl.textContent = '';
      advance(node.next);
      return;
    }

    const caret = caretSlot();
    let advanced = false;

    function allowAdvance() {
      const hintText = node.hint
        || (currentClickable().length ? '点房间里发光的东西，可以看它的来历' : '');
      setHint(hintText);
      const right = $('#hint .right');
      if (right) right.textContent = '空格 / 点文字继续';
    }

    function hit() {
      if (advanced || paperOpen || awaitingChoice) return;
      if (typer && !typer.done()) { typer.skip(); return; }  // 第一下：把字补完
      if (hasNote) return;                                  // 纸自己会推进
      advanced = true;                                      // 第二下：往下走
      advance(node.next);
    }

    // 纸上的标题由数据决定。督导笔记默认不写标题——左上角的类型标签
    // 已经说明了这是什么，再写一遍"督导笔记"就是同一句话说两次。
    var noteMeta = node.note || { kind: 'supervision' };

    // **必须在启动打字机之前就挂上**。
    // 打字机跑的时候每次都重建了 #text 的内容，但 _advance 要是这时候还没挂，
    // 玩家在头一两秒里点文字就完全没反应——看起来像卡住了。
    textEl.onclick = hit;
    textEl._advance = hit;
    // 这一段答完之后会滑进来一张纸。纸自己会推进，所以这一小段时间里
    // 点文字是"没反应"的——把这件事说出来，别让调用方以为卡住了。
    textEl._awaitingNote = hasNote;

    typer = typewrite(textEl, node.text, {
      onEnd: function () {
        if (caret) caret.classList.remove('off');
        allowAdvance();
        if (hasNote) {
          // 话说完了，纸从右边滑进来
          showPaper({
            kind: noteMeta.kind || 'supervision',
            title: noteMeta.title || '',
            lines: [noteMeta.text || node.text],
            button: '知道了',
            slide: true,
            write: true,
            speed: 24,
            onClose: function () { advance(node.next); },
          });
        }
      },
    });
    if (caret) caret.classList.add('off');

    if (node.next === null || node.next === undefined) allowAdvance();
  }

  /** 画一个选择点：先把提示句说出来，再挂选项 */
  function renderChoice(node) {
    if (state.screen !== 'story') return;
    renderTop(chapterLabel());
    renderRoom();

    if (typer) typer.skip();
    setWho('', '');

    const textEl = $('#text');
    textEl.onclick = null;
    textEl._advance = null;
    textEl.textContent = node.prompt || '';

    const choicesEl = $('#choices');
    choicesEl.innerHTML = '';
    choicesEl.style.display = '';
    awaitingChoice = true;

    node.options.forEach(function (opt, i) {
      const btn = make('button', { class: 'choice', type: 'button' });
      btn.appendChild(make('span', { class: 'key', text: String(i + 1) }));
      btn.appendChild(make('span', { class: 'label', text: opt.label }));
      btn.addEventListener('click', function () { X.ui.chooseOption(i); });
      choicesEl.appendChild(btn);
      if (i === 0) window.setTimeout(function () { btn.focus({ preventScroll: true }); }, 30);
    });

    setHint(node.hint || '');
    const right = $('#hint .right');
    if (right) right.textContent = '按 1–' + node.options.length + ' 也能选';
  }

  /** 总入口：按节点类型分派 */
  function renderNode() {
    if (state.screen !== 'story') return;
    const node = state.node;
    if (!node) return;

    if (node.type === 'choice') return renderChoice(node);
    if (node.type === 'say') return renderSay(node);

    // 以下是"纸"类的节点，正文区空着，靠弹层推进
    renderTop(chapterLabel());
    renderRoom();
    const textEl = $('#text');
    if (typer) typer.skip();
    textEl.onclick = null;
    textEl._advance = null;
    clearChoices();
    paperOpen = true;

    if (node.type === 'card') {
      setWho('', '');
      textEl.textContent = '';
      setHint('');
      showPaper({
        kind: node.kind || 'science',
        title: node.title,
        lines: node.lines,
        footer: node.footer,
        button: node.button,
        onClose: function () {
          paperOpen = false;
          if (node.ending) { finishStory(); return; }
          advance(node.next);
        },
      });
      return;
    }

    if (node.type === 'result') {
      setWho('', '');
      textEl.textContent = '';
      setHint('');
      showResult(node);
      return;
    }

    if (node.type === 'diary') {
      setWho('', '');
      textEl.textContent = '';
      setHint('');
      showDiary(node, function () { paperOpen = false; advance(node.next); });
      return;
    }
  }

  function chapterLabel() {
    const meta = E.sectionMeta(state.story, state.line);
    if (!meta) return '';
    return state.story.title + ' · ' + meta.title + (meta.subtitle ? ' · ' + meta.subtitle : '');
  }

  /** 推进到下一个节点并重画 */
  function advance(target) {
    if (state.screen !== 'story') return;
    const before = state.line;
    const node = E.go(target);
    if (!node) return;
    const beforeSec = before.split('/')[0];
    const afterSec = state.line.split('/')[0];
    E.enter(node);

    // 换小节：淡出淡入一次
    if (beforeSec !== afterSec) {
      transition(function () { renderNode(); });
    } else {
      renderNode();
    }
    E.saveCurrent();
  }

  function transition(mid) {
    const fade = $('#fade');
    fade.classList.add('on');
    window.setTimeout(function () {
      mid();
      window.setTimeout(function () { fade.classList.remove('on'); }, 90);
    }, 480);
  }

  // --------------------------------------------------------------------------
  // 成绩单
  // --------------------------------------------------------------------------
  /** 成绩单只看一次：看过之后按钮改成"继续"，别一直让人以为还有新东西 */
  let resultSeen = false;

  function showResult(node) {
    const flags = state.flags;
    const choices = state.choices;

    // 这一节真正发生了什么，全部从 choices / flags 里读出来，不写死
    const lines = [];
    const openB = flags.openB;
    lines.push(['开场', openB ? '你先问他想聊什么，而不是复述转介单。'
      : flags.openA ? '你复述了转介单上「配合度差」那句。'
        : '你问了「最近怎么样」，换回一个安全答案。']);
    lines.push(['保密例外', flags.askedBoundary
      ? '你把边界讲清楚了，他追问了一次——说明他听进去了。'
      : '你讲完了设置，但没确认他听懂没有。']);
    lines.push(['王医生的托付', flags.ethB ? '你没替来访者做主，也没当面驳他。'
      : flags.ethA ? '你答应了一件不该由你答应的事。'
        : '你指出了医学事实，但那是你在走廊里替他定的调。']);
    lines.push(['危机筛查', flags.screened
      ? (flags.crisisTriggered ? '你问了。他说了。你按写死的流程接住了他。' : '你问了，他答了。')
      : '你没问。这不扣分，但下次得问。']);

    const diaryRead = state.diaryRead.length;
    lines.push(['情绪日记', diaryRead >= 4 ? '四条都看了。你从里头认出了自动化思维、个人化、读心术和回避。'
      : '你看了 ' + diaryRead + ' 条。剩下的没看，也就没谈。']);

    lines.push(['「等我能走了」', flags.waiting ? '你没拆他的目标，你把「等」摆到了桌面上。'
      : flags.reality ? '你宣布了「接受现实」——目标是他的，不该由你说。'
        : '你抛回了一个太虚的问题，他接不住。']);

    const cards = state.cardsSeen.length;
    lines.push(['看过的资料', cards + ' 张']);

    const body = make('div', {});
    const ul = make('ul', { class: 'tally' });
    lines.forEach(function (pair) {
      const li = make('li', {});
      li.appendChild(make('span', { class: 'k', text: pair[0] }));
      const v = make('span', { class: 'v', text: pair[1] });
      if (/没问|不该|不安全|没看|接不住|复述/.test(pair[1])) v.className = 'v miss';
      li.appendChild(v);
      ul.appendChild(li);
    });
    body.appendChild(ul);

    if (!flags.screened) {
      body.appendChild(make('p', {
        style: 'color:#8a5a20',
        text: '提醒：这条线里你没有做危机筛查。脊髓损伤的人里，抑郁很容易被漏掉——' +
          '「没劲儿」「不想动」「睡不好」太容易被当成身体的问题。下一次，得问。',
      }));
    }
    body.appendChild(make('p', {
      style: 'color:#6d6250;font-size:13.5px;margin-top:14px',
      text: '同一件事有不止一种做法，没有哪一次选择会卡死。',
    }));

    const paper = make('div', { class: 'paper', 'data-kind': 'result' });
    paper.appendChild(make('div', { class: 'head' }, [
      make('span', { class: 'label', text: '成绩' }),
      make('span', { class: 'rule' }),
    ]));
    paper.appendChild(make('h2', { text: node.title }));
    if (node.lead) {
      // lead 用衬线，和台词分开——这是"结论"，不是"对话"
      paper.appendChild(make('p', {
        class: 'result-lead',
        text: node.lead,
      }));
    }
    const bodyWrap = make('div', { class: 'body' });
    bodyWrap.appendChild(body);
    paper.appendChild(bodyWrap);

    const actions = make('div', { class: 'actions' });
    const btn = make('button', {
      class: 'btn primary', type: 'button',
      text: resultSeen ? '继续' : (node.button || '继续'),
    });
    resultSeen = true;
    actions.appendChild(btn);
    paper.appendChild(actions);
    overlayEl.innerHTML = '';
    overlayEl.className = 'on';
    overlayEl.appendChild(paper);
    btn.focus({ preventScroll: true });
    btn.addEventListener('click', function () {
      closeOverlay();
      paperOpen = false;
      advance(node.next);
    });
  }

  // --------------------------------------------------------------------------
  // 通关
  // --------------------------------------------------------------------------
  function finishStory() {
    E.markDone(state.story.id);
    E.clearCurrent();
    state.screen = 'end';
    renderEnd();
  }

  function renderEnd() {
    renderTop('');
    const main = $('#main');
    const panel = $('#panel');
    panel.style.display = '';
    main.style.display = 'none';
    panel.innerHTML = '';

    panel.appendChild(make('div', { id: 'who' }));
    const h = make('div', {
      style: 'font-size:26px;letter-spacing:.06em;margin:0 0 14px',
      text: '故事线一 · 完',
    });
    panel.appendChild(h);

    const text = make('div', {
      style: 'font-size:18px;line-height:1.95;color:#b9b5ac;max-width:38em',
      text: '他把「等我能走了」往后挪了一格，腾出一小块地方，放了一件今天就能做的小事。' +
        '这就是今天全部的成绩——不是痊愈，是带着工具继续生活。',
    });
    panel.appendChild(text);

    const row = make('div', { style: 'display:flex;gap:10px;margin-top:24px;flex-wrap:wrap' });
    const again = make('button', { class: 'btn primary', type: 'button', text: '再来一遍' });
    again.addEventListener('click', function () { startStory(X.storySci); });
    const home = make('button', { class: 'btn', type: 'button', text: '回标题页' });
    home.addEventListener('click', function () { state.screen = 'title'; render(); });
    const help = make('button', { class: 'btn', type: 'button', text: '求助资源' });
    help.addEventListener('click', function () { openCrisisHelp(); });
    row.appendChild(again); row.appendChild(home); row.appendChild(help);
    panel.appendChild(row);
  }

  // --------------------------------------------------------------------------
  // 总渲染
  // --------------------------------------------------------------------------
  function render() {
    if (state.screen === 'title') return renderTitle();
    if (state.screen === 'choose') return renderChoose();
    if (state.screen === 'story') return renderStoryShell();
    if (state.screen === 'end') return renderEnd();
  }

  function renderStoryShell() {
    const main = $('#main');
    const panel = $('#panel');
    main.style.display = 'none';
    main.innerHTML = '';
    panel.style.display = '';
    panel.innerHTML = '';

    // 场景
    const stage = make('div', { id: 'stage' });
    stage.appendChild(make('div', { id: 'roomWrap' }, [
      make('div', { id: 'room' }),
    ]));
    // 对话区
    const who = make('div', { id: 'who' });
    const text = make('div', { id: 'text' });
    const choices = make('div', { id: 'choices' });
    choices.style.display = 'none';
    const hint = make('div', { id: 'hint' });
    panel.appendChild(who); panel.appendChild(text);
    panel.appendChild(choices); panel.appendChild(hint);

    // stage 放在 panel 之前：DOM 顺序决定上下位置
    panel.parentNode.insertBefore(stage, panel);
  }

  X.ui.render = render;
  X.ui.renderNode = function () { renderNode(); };
  X.ui.showResult = showResult;
  X.ui.advance = advance;
  X.ui.openCrisisHelp = openCrisisHelp;
  X.ui.startStory = startStory;
  X.ui.scaleRoom = scaleRoom;

  /**
   * 清干净回到标题页。
   * 别让外部直接改 state 再调 render()——那样上一局的 overlay / 打字机 /
   * 选项状态都还留着，下一页会莫名其妙（测试里踩过）。
   */
  X.ui.restart = function () {
    if (typer) { typer.skip(); typer = null; }
    closeOverlay();
    awaitingChoice = false;
    paperOpen = false;
    resultSeen = false;
    state.screen = 'title';
    state.story = null;
    state.node = null;
    state.line = null;
    render();
  };

  // 选选项
  X.ui.chooseOption = function (index) {
    const node = state.node;
    if (!node || node.type !== 'choice' || !awaitingChoice) return;
    const opt = node.options[index];
    if (!opt) return;
    E.recordChoice(state.line, opt);
    awaitingChoice = false;
    clearChoices();
    advance(opt.next);
  };

  // --------------------------------------------------------------------------
  // 键盘
  // --------------------------------------------------------------------------
  document.addEventListener('keydown', function (ev) {
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;

    // 纸开着时，空格 / 回车 = 点那张纸的按钮
    if (overlayEl && overlayEl.classList.contains('on')) {
      if (ev.key === ' ' || ev.key === 'Enter') {
        const btn = $('.btn.primary', overlayEl) || $('.btn', overlayEl);
        if (btn) { ev.preventDefault(); btn.click(); }
      }
      return;
    }

    if (state.screen !== 'story') {
      if (ev.key === 'Escape' && state.screen !== 'title') {
        state.screen = 'title';
        render();
      }
      return;
    }

    if (awaitingChoice) {
      const n = parseInt(ev.key, 10);
      if (n >= 1 && n <= 9) {
        ev.preventDefault();
        X.ui.chooseOption(n - 1);
      }
      return;
    }

    if (ev.key === ' ' || ev.key === 'Enter') {
      ev.preventDefault();
      const t = $('#text');
      if (t && t._advance) t._advance();
    }
  });

  window.addEventListener('resize', function () {
    if (state.screen === 'story') scaleRoom();
  });

  // --------------------------------------------------------------------------
  // 启动
  // --------------------------------------------------------------------------
  X.ui.boot = function () {
    E.load();
    render();
  };
})(window.XLZX = window.XLZX || {});

/* ===== 启动 ===== */
window.XLZX.ui.boot();

</script>

</body>
